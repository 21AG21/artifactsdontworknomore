<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AP Chem Unit 3 Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* minimono.css — the house style's base: tokens, type, the two-pane layout,
   the windowed overlay, and flat native controls.
   Targets two screens: MacBook Air 15" (1710×1107, 2×) and Dell P2423D
   (2560×1440, 1×). Every line is 1px — half-pixels vanish on the Dell.     */

/* ── Tokens ─────────────────────────────────────────────────────────────── */
:root{
  color-scheme: light dark;            /* native controls + scrollbars follow the theme */
  --ground:#EEF1F4; --wall:#ffffff;
  --ink:#0a0a0b; --ink-soft:#5F6368; --muted:#9c9ca3;
  --hair:rgba(10,10,12,.13); --hair-soft:rgba(10,10,12,.08);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;
  --pane-l:25%;                        /* the left pane is one quarter, always */
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#000000; --wall:#161618; --ink:#f6f6f8; --ink-soft:#a0a0a8; --muted:#67676f;
  --hair:rgba(255,255,255,.16); --hair-soft:rgba(255,255,255,.09);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#000000; --wall:#161618; --ink:#f6f6f8; --ink-soft:#a0a0a8; --muted:#67676f;
  --hair:rgba(255,255,255,.16); --hair-soft:rgba(255,255,255,.09);
}
:root[data-theme="light"]{ color-scheme: light; }

/* ── Base ───────────────────────────────────────────────────────────────── */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; overflow:hidden; }
body{
  background:var(--ground); color:var(--ink);
  font:16px/1.5 var(--sans); -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
:focus, :focus-visible{ outline:none; }
/* focus shows only after Tab (minimono.js sets .kbd-nav; any click clears it),
   as a thin grey line — never a bright ring, never from Shift or a click */
html.kbd-nav :focus-visible{ outline:1px solid var(--muted); outline-offset:3px; border-radius:6px; }
/* text selection keeps the system highlight — never restyle ::selection */
a{ color:inherit; text-decoration:none; }
/* scrollbars: left to macOS — overlay, thin, shown while scrolling. Never hidden. */

/* ── Type (tuned for 1710 and 2560 wide). Weights: 300 · 400 · 500, never more ─ */
.hero { font-size:clamp(64px, 4.6vw, 112px); font-weight:300; line-height:1.02; letter-spacing:-.035em; margin:0; }
.h2   { font-size:clamp(28px, 1.9vw, 40px);  font-weight:500; line-height:1.15; letter-spacing:-.02em; margin:0; }
.text { font-size:clamp(17px, 1.05vw, 20px); line-height:1.55; max-width:68ch; }
.label{ font-size:13px; font-weight:500; color:var(--ink-soft); letter-spacing:.005em; }
.num  { font-weight:400; letter-spacing:-.02em; }

/* ── Layout: two panes, left ¼ · right ¾, each its own scroller ─────────── */
#app{ display:flex; height:100dvh; }
.pane-l{
  flex:0 0 var(--pane-l); height:100%; overflow-y:auto; overscroll-behavior:contain;
  border-right:1px solid var(--hair-soft); background:var(--ground);
  padding:48px 32px 64px;
}
.pane-r{ flex:1 1 auto; min-width:0; height:100%; overflow-y:auto; overscroll-behavior:contain; }
.pane-r .body{ max-width:1120px; padding:56px clamp(48px, 5vw, 120px) 120px; }

/* the list in the left pane */
.row{
  display:block; width:100%; padding:14px 0; border-bottom:1px solid var(--hair-soft);
  font-size:clamp(17px, 1.15vw, 22px); color:var(--ink-soft); cursor:pointer;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.row:last-child{ border-bottom:0; }
@media (hover:hover){ .row:hover{ color:var(--ink); } }
.row[aria-current="true"]{ color:var(--ink); font-weight:500; }
.row:active{ opacity:.6; }

/* ── One-pane mode: windowed, or the person hid the left pane ────────────
   The left pane leaves the layout; it comes back as an overlay (the SAME
   element, moved) when the pointer enters the top-left zone — the left
   quarter of the width, the top sixth of the height — or on `.           */
.pane-hide{
  border:0; background:none; padding:4px 0; margin:0;
  font:inherit; font-size:13px; color:var(--ink-soft); cursor:pointer; text-align:left;
}
.pane-hide kbd{ font:inherit; color:var(--muted); margin-left:6px; }
.pane-hide .keep{ display:none; }
html.is-single .pane-hide .hide{ display:none; }
html.is-single .pane-hide .keep{ display:inline; }
html.is-windowed .pane-hide{ display:none; }        /* windowed: the overlay is the only way it shows */
@media (hover:hover){ .pane-hide:hover{ color:var(--ink); } }
.menu-hint{ display:none; }
/* one-pane mode: the link sits in the top-left zone, invisible until the
   pointer enters that zone (or it takes keyboard focus); always shown on touch */
html.is-single .menu-hint{
  display:block; position:fixed; z-index:15;
  top:calc(env(safe-area-inset-top, 0px) + 18px); left:max(16px, env(safe-area-inset-left, 0px), 2vw);
  padding:6px 10px; margin:0; border-radius:8px; background:var(--ground);
  font-size:13px; color:var(--ink-soft); cursor:pointer;
  opacity:0; pointer-events:none; transition:opacity .14s ease;
}
html.is-single .menu-hint kbd{ font:inherit; color:var(--muted); margin-left:6px; }
html.is-single.hint-on .menu-hint,
html.kbd-nav.is-single .menu-hint:focus-visible{ opacity:1; pointer-events:auto; }
@media (hover:none){ html.is-single .menu-hint{ opacity:1; pointer-events:auto; } }
@media (hover:hover){ html.is-single .menu-hint:hover{ color:var(--ink); } }

html.is-single .pane-l{
  position:fixed; z-index:20; inset:0 auto 0 0; width:clamp(280px, 25vw, 640px);
  transform:translateX(-100%); visibility:hidden;
  transition:transform .22s cubic-bezier(.32,.72,0,1), visibility 0s linear .22s;
}
html.is-single.menu-open .pane-l{
  transform:none; visibility:visible; border-right:1px solid var(--hair);
  transition:transform .22s cubic-bezier(.32,.72,0,1), visibility 0s;
}

/* ── Controls: native elements, flat ────────────────────────────────────── */
/* slider + checkbox + radio take ink through accent-color, natively */
input[type="range"], input[type="checkbox"], input[type="radio"]{ accent-color:var(--ink); }
input[type="range"]{ width:100%; max-width:420px; cursor:pointer; }

/* toggle: a checkbox with role="switch", drawn flat */
input[type="checkbox"][role="switch"]{
  -webkit-appearance:none; appearance:none; margin:0; flex:none; cursor:pointer;
  position:relative; width:40px; height:24px; border-radius:999px;
  background:var(--hair); transition:background .16s ease;
}
input[type="checkbox"][role="switch"]::before{
  content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:999px;
  background:var(--ground); transition:transform .18s cubic-bezier(.32,.72,0,1);
}
input[type="checkbox"][role="switch"]:checked{ background:var(--ink); }
input[type="checkbox"][role="switch"]:checked::before{ transform:translateX(16px); }

/* segmented choice: a radio group; the chosen one is heavier ink + a 2px mark */
.seg{ display:inline-flex; gap:28px; border:0; padding:0; margin:0; }
.seg label{ position:relative; cursor:pointer; padding:6px 0; color:var(--ink-soft); font-weight:400; }
.seg input{ position:absolute; opacity:0; width:1px; height:1px; }
.seg input:checked + span{ color:var(--ink); font-weight:500; }
.seg input:checked + span::after{
  content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--ink); border-radius:2px;
}
html.kbd-nav .seg input:focus-visible + span{ outline:1px solid var(--muted); outline-offset:4px; border-radius:6px; }
@media (hover:hover){ .seg label:hover span{ color:var(--ink); } }

/* search */
input[type="search"]{
  -webkit-appearance:none; appearance:none; width:100%; max-width:420px;
  font:inherit; font-size:16px; color:var(--ink);
  background:var(--wall); border:0; border-radius:10px; padding:10px 14px;
}
input[type="search"]::placeholder{ color:var(--muted); }

/* buttons: only for real actions — navigation is text */
button{ font:inherit; cursor:pointer; }
.btn{ border:0; border-radius:10px; padding:10px 18px; font-weight:500; background:var(--wall); color:var(--ink); }
.btn.primary{ background:var(--ink); color:var(--ground); }
.btn:active{ opacity:.6; }

/* ── Multiple-choice questions (quiz.js builds them from JSON) ─────────────
   State without color: the right answer gets an ink bar and Medium weight,
   a wrong pick is struck through, everything else recedes to grey. */
.mcq-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:44px; max-width:760px; }
.mcq-q{ display:grid; grid-template-columns:2em minmax(0, 1fr); column-gap:10px; outline-offset:8px; }
.mcq-n{ font-size:clamp(19px, 1.25vw, 24px); line-height:1.45; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.mcq-body{ display:flex; flex-direction:column; gap:12px; min-width:0; }
.mcq-text{ margin:0; font-size:clamp(19px, 1.25vw, 24px); line-height:1.45; color:var(--ink); }
.mcq-text mjx-container[display="true"]{ margin:.5em 0 !important; }
.mcq-opts{ display:flex; flex-direction:column; gap:2px; }
.mcq-opt{
  display:grid; grid-template-columns:1.5em minmax(0, 1fr); align-items:baseline; gap:8px;
  width:calc(100% + 20px); margin:0 -10px; padding:9px 10px; border:0; border-radius:8px;
  background:none; text-align:left; font:inherit; font-size:clamp(17px, 1.05vw, 20px); line-height:1.45;
  color:var(--ink); cursor:pointer;
}
.mcq-l{ color:var(--ink-soft); font-variant-numeric:tabular-nums; }
@media (hover:hover){ .mcq-q:not(.is-done) .mcq-opt:hover{ background:var(--wall); } }
.mcq-q:not(.is-done) .mcq-opt:active{ opacity:.6; }
.mcq-q.is-done .mcq-opt{ cursor:default; color:var(--ink-soft); }
.mcq-q.is-done .mcq-opt.is-answer{ color:var(--ink); font-weight:500; box-shadow:inset 2px 0 0 var(--ink); }
.mcq-q.is-done .mcq-opt.is-answer .mcq-l{ color:var(--ink); }
.mcq-q.is-done .mcq-opt.is-chosen:not(.is-answer) .mcq-t{ text-decoration:line-through; text-decoration-thickness:1px; }
.mcq-fb{ margin:6px 0 0; font-size:17px; font-weight:500; color:var(--ink); }
.mcq-why{ margin:0; font-size:17px; line-height:1.5; color:var(--ink-soft); max-width:62ch; }
.mcq-bar{ display:flex; align-items:center; flex-wrap:wrap; gap:12px; margin-top:44px; }
.mcq-score{ font-size:15px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.mcq-fallback{ width:100%; max-width:760px; min-height:160px; margin-top:16px; font:14px/1.5 var(--sans); color:var(--ink);
  background:var(--wall); border:0; border-radius:10px; padding:12px 14px; }
/* the question numbers, in the left pane of a quiz page */
.mcq-nav{ display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:4px; }
.mcq-nav a{ display:block; padding:8px 0; border-radius:8px; text-align:center; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
@media (hover:hover){ .mcq-nav a:hover{ background:var(--wall); color:var(--ink); } }
.mcq-nav a.is-right{ color:var(--ink); text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:.25em; }
.mcq-nav a.is-wrong{ color:var(--ink); text-decoration:line-through; text-decoration-thickness:1px; }
/* fractions stay full size inline */
mjx-container[jax="SVG"]:not([display="true"]){ margin:0 .08em; }

/* ── Loading: the one color exception — a thin rainbow ring, only while loading */
.loading{
  width:18px; height:18px; border-radius:50%;
  background:conic-gradient(#ff3b30,#ff9500,#ffcc00,#34c759,#00c7be,#007aff,#af52de,#ff3b30);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
          mask:radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
  animation:mm-spin .9s linear infinite;
}
@keyframes mm-spin{ to{ transform:rotate(1turn); } }

@media (prefers-reduced-motion:reduce){
  *{ animation:none!important; transition:none!important; }
}


.side{display:flex;flex-direction:column;gap:28px;margin-top:28px}
.side-title{font-size:clamp(28px,1.9vw,40px);font-weight:300;letter-spacing:-.02em;line-height:1.15;margin:0}
.tally{font-size:15px;color:var(--ink-soft);font-variant-numeric:tabular-nums;min-height:1.5em}
.side-actions{display:flex;flex-wrap:wrap;gap:10px}
.side .label{margin:0 0 8px}
.mcq-nav a.is-picked{color:var(--ink);font-weight:500}
.mcq-opt.is-picked{background:var(--wall);font-weight:500}
.mcq-q:not(.is-done) .mcq-opt.is-picked .mcq-l{color:var(--ink)}
.mcq-q.is-done .mcq-opt.is-picked{background:none}
.textbtn{align-self:flex-start;background:none;border:0;padding:6px 0;min-height:28px;color:var(--ink-soft);font-weight:500;font-size:15px;cursor:pointer}
@media (hover:hover){.textbtn:hover{color:var(--ink)}}
.textbtn:active{opacity:.55}
.mcq-act{display:flex;gap:28px}
.fig{max-width:560px;color:var(--ink);overflow-x:auto}
.fig svg{width:100%;height:auto;display:block}
.dt{border-collapse:collapse;font-size:clamp(16px,1vw,19px);font-variant-numeric:tabular-nums}
.dt th,.dt td{text-align:left;padding:8px 28px 8px 0;border-bottom:1px solid var(--hair-soft);font-weight:400;vertical-align:baseline}
.dt th{color:var(--ink-soft);font-weight:500;font-size:14px}
.free{display:flex;flex-direction:column;gap:56px;max-width:760px;margin-top:140px}
.frq-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:110px}
.frq{display:flex;flex-direction:column;gap:22px;outline-offset:8px}
.frq-head{display:grid;grid-template-columns:2em minmax(0,1fr) auto;column-gap:10px;align-items:baseline}
.frq-title{font-size:clamp(22px,1.5vw,30px);font-weight:500;letter-spacing:-.015em;line-height:1.2}
.frq-pts{font-size:14px;color:var(--muted)}
.frq-stem{padding-left:calc(2em + 10px);font-size:clamp(17px,1.05vw,20px);line-height:1.55;display:flex;flex-direction:column;gap:16px;min-width:0;overflow-x:auto}
.frq-stem p{margin:0;max-width:68ch}
.frq-parts{list-style:none;margin:0;padding:0 0 0 calc(2em + 10px);display:flex;flex-direction:column;gap:30px}
.frq-part{display:grid;grid-template-columns:1.5em minmax(0,1fr);column-gap:8px}
.frq-l{color:var(--ink-soft);font-size:clamp(17px,1.05vw,20px);line-height:1.55}
.frq-pb{display:flex;flex-direction:column;gap:8px;min-width:0}
.frq-q{margin:0;font-size:clamp(17px,1.05vw,20px);line-height:1.55;max-width:68ch}
.frq-p{color:var(--muted);font-size:.85em;white-space:nowrap}
.frq-ans{border-left:1px solid var(--hair);padding:2px 0 2px 16px;font-size:17px;line-height:1.55;max-width:68ch;display:flex;flex-direction:column;gap:8px;min-width:0;overflow-x:auto}
.frq-ans p{margin:0}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%}
@media (max-width:640px){
  .pane-r .body{padding:44px max(16px, env(safe-area-inset-right, 0px)) 96px max(16px, env(safe-area-inset-left, 0px))}
  .frq-stem,.frq-parts{padding-left:0}
}

<tr><td>Dimethyl ether</td><td>\( \ce{CH3OCH3} \)</td><td>46.07 g/mol</td><td>−24 °C</td><td>5.9 atm</td></tr>
<tr><td>Ethanol</td><td>\( \ce{CH3CH2OH} \)</td><td>46.07 g/mol</td><td>78 °C</td><td>0.078 atm</td></tr>
</tbody></table>`,
      parts: [
        { pts: 2, q: R`Draw a complete Lewis diagram of dimethyl ether. Give the hybridization of the O atom and the approximate C–O–C bond angle.`,
          a: R`<p>20 valence electrons. Each C has three C–H bonds and one C–O bond; O has two bonds and two lone pairs.</p>
<p>O has 4 electron domains (2 bonds, 2 lone pairs): \( sp^3 \), bent, about 109.5° (VSEPR predicts slightly less, because lone pairs repel more than bonding pairs).</p>` },
        { pts: 2, q: R`Explain why dimethyl ether boils higher than propane even though their masses are almost equal.`,
          a: R`<p>Dimethyl ether is bent with polar C–O bonds, so it has a net dipole and dipole–dipole forces in addition to dispersion forces. Propane is essentially nonpolar and has only dispersion forces of about the same size. The extra attraction raises the ether's boiling point.</p>` },
        { pts: 2, q: R`Explain why ethanol boils more than 100 °C higher than dimethyl ether, an isomer with the same atoms.`,
          a: R`<p>Ethanol has an H bonded directly to O, so its molecules hydrogen bond to each other. In dimethyl ether every H is bonded to C, so it cannot hydrogen bond with itself. Hydrogen bonds are much stronger than the dipole–dipole forces in the ether, so far more energy is needed to separate ethanol molecules.</p>` },
        { pts: 2, q: R`Dimethyl ether is quite soluble in water even though it cannot hydrogen bond with itself. Identify the strongest attraction between a dimethyl ether molecule and a water molecule, and describe how the two molecules are oriented.`,
          a: R`<p>A hydrogen bond. The ether's O has lone pairs, so it can accept a hydrogen bond: an H of a water molecule (δ+, bonded to O) points at a lone pair on the ether's O (δ−). Water supplies the H; the ether supplies the lone pair.</p>` },
        { pts: 2, q: R`At 25 °C, 0.100 mol of a compound is sealed in an evacuated, rigid 1.00 L flask. Show whether the ideal gas law correctly predicts the pressure in the flask if the compound is dimethyl ether, and if it is ethanol.`,
          a: R`<p>If all of it were gas: \( P = \dfrac{nRT}{V} = \dfrac{(0.100)(0.08206)(298.15)}{1.00} = 2.45 \) atm.</p>
<p>Dimethyl ether: 2.45 atm is below its vapor pressure (5.9 atm), so it stays entirely gas and the ideal gas law is about right.</p>
<p>Ethanol: 2.45 atm is far above its vapor pressure (0.078 atm), so most of it condenses. The pressure stops at 0.078 atm, and the ideal gas law (which assumes it is all gas) fails.</p>` }
      ] },

    { title: 'Red 40 in a sports drink',
      stem: R`<p>A student finds the concentration of the dye Red 40 (496.4 g/mol) in a red sports drink. She measures standards at 504 nm in a 1.00 cm cuvette.</p>
<table class="dt"><thead><tr><th>[Red 40] (µM)</th><th>Absorbance</th></tr></thead><tbody>
<tr><td>5.0</td><td>0.128</td></tr><tr><td>10.0</td><td>0.254</td></tr><tr><td>20.0</td><td>0.505</td></tr><tr><td>30.0</td><td>0.759</td></tr><tr><td>40.0</td><td>1.012</td></tr>
</tbody></table>
<p>The undiluted drink reads \( A = 1.85 \). She pipets 10.00 mL of the drink into a 50.00 mL volumetric flask, fills it to the mark with distilled water, and the diluted solution reads \( A = 0.372 \).</p>`,
      parts: [
        { pts: 1, q: R`The drink looks red. Explain why 504 nm (blue-green light) was chosen rather than a red wavelength.`,
          a: R`<p>The drink looks red because it transmits red light and absorbs its complement, blue-green. Absorbance is greatest near 504 nm (\( \lambda_{\max} \)), giving the steepest calibration line and the most sensitive measurement. At a red wavelength it would absorb almost nothing.</p>` },
        { pts: 2, q: R`Determine the molar absorptivity of Red 40 at 504 nm. Include units.`,
          a: R`<p>Slope \( = \dfrac{1.012 - 0.128}{40.0 - 5.0} = 0.02526\ \mu\text{M}^{-1} \) (a best-fit line gives the same).</p>
<p>\( \varepsilon b = 0.02526\ \mu\text{M}^{-1} = 2.53 \times 10^{4}\ \text{M}^{-1} \). With \( b = 1.00 \) cm, \( \varepsilon = 2.53 \times 10^{4}\ \text{M}^{-1}\,\text{cm}^{-1} \).</p>` },
        { pts: 2, q: R`Calculate the concentration of Red 40 in the undiluted drink.`,
          a: R`<p>Diluted: \( c = \dfrac{0.372}{0.02526} = 14.7\ \mu\text{M} \).</p>
<p>Dilution factor \( = \dfrac{50.00}{10.00} = 5 \), so the drink is \( 5 \times 14.7 = 73.7\ \mu\text{M} \) (\( 7.37 \times 10^{-5} \) M).</p>
<p>Reading 1.85 straight off the line would not be valid: it is beyond the highest standard.</p>` },
        { pts: 2, q: R`Calculate the mass of Red 40, in milligrams, in one 591 mL bottle of the drink.`,
          a: R`<p>\( n = (7.37 \times 10^{-5}\ \text{mol/L})(0.591\ \text{L}) = 4.35 \times 10^{-5} \) mol</p>
<p>\( m = (4.35 \times 10^{-5})(496.4) = 0.0216 \) g \( = 21.6 \) mg</p>` },
        { pts: 1, q: R`Before filling the cuvette with the diluted drink, she rinsed it with distilled water and did not rinse it with the solution. Would her calculated concentration be too high, too low, or unaffected? Justify.`,
          a: R`<p>Too low. Water left in the cuvette dilutes the sample, so fewer dye molecules are in the light path, the absorbance is lower, and the calculated concentration is lower.</p>` },
        { pts: 1, q: R`Calculate the energy of one 504 nm photon.`,
          a: R`<p>\[ E = \frac{hc}{\lambda} = \frac{(6.626 \times 10^{-34})(2.998 \times 10^{8})}{504 \times 10^{-9}} = 3.94 \times 10^{-19}\ \text{J} \]</p>` },
        { pts: 1, q: R`Could the same method measure the sugar (sucrose) in the drink? Explain.`,
          a: R`<p>No. Sucrose is colorless: its electrons are not excited by visible light, so it does not absorb at any visible wavelength and its absorbance would not change with concentration.</p>` }
      ] },

    { title: 'Two bulbs and a white ring',
      stem: R`<p>Two glass bulbs at 25 °C are joined by a tube with a closed valve. Bulb 1 (2.00 L) holds \( \ce{NH3} \) at 2.00 atm. Bulb 2 (3.00 L) holds \( \ce{HCl} \) at 1.00 atm. When the valve is opened, the gases react: \( \ce{NH3(g) + HCl(g) -> NH4Cl(s)} \). The volume of the tube and the solid can be ignored.</p>`,
      parts: [
        { pts: 1, q: R`Before the valve is opened, which bulb's molecules have the greater average kinetic energy? Justify.`,
          a: R`<p>Neither. Average kinetic energy depends only on temperature, and both bulbs are at 25 °C. The different pressures and masses do not matter.</p>` },
        { pts: 2, q: R`Calculate the mass of \( \ce{NH4Cl} \) that forms.`,
          a: R`<p>\( n_{\ce{NH3}} = \dfrac{(2.00)(2.00)}{(0.08206)(298.15)} = 0.1635 \) mol; \( n_{\ce{HCl}} = \dfrac{(1.00)(3.00)}{(0.08206)(298.15)} = 0.1226 \) mol</p>
<p>HCl is limiting: \( (0.1226)(53.49) = 6.56 \) g \( \ce{NH4Cl} \)</p>` },
        { pts: 2, q: R`After the reaction, the system returns to 25 °C. Calculate the final pressure in the connected bulbs.`,
          a: R`<p>Excess \( \ce{NH3} \): \( 0.1635 - 0.1226 = 0.0409 \) mol in 5.00 L.</p>
<p>\( P = \dfrac{(0.0409)(0.08206)(298.15)}{5.00} = 0.200 \) atm. HCl is used up and the solid adds no pressure.</p>` },
        { pts: 2, q: R`In a related demonstration, cotton soaked in ammonia and cotton soaked in hydrochloric acid are placed at opposite ends of a 100.0 cm glass tube at the same time. A white ring of \( \ce{NH4Cl} \) forms where the gases meet. Predict how far from the \( \ce{NH3} \) end it forms.`,
          a: R`<p>\[ \frac{r_{\ce{NH3}}}{r_{\ce{HCl}}} = \sqrt{\frac{36.46}{17.03}} = 1.463 \]</p>
<p>In the same time, distance is proportional to rate: \( \dfrac{1.463}{1.463 + 1} \times 100.0 = 59.4 \) cm from the \( \ce{NH3} \) end (closer to the HCl end).</p>` },
        { pts: 2, q: R`Draw the Lewis diagram of \( \ce{NH4+} \). Give its shape and H–N–H bond angle.`,
          a: R`<p>8 electrons: N with four single bonds to H and no lone pairs, in brackets with a + charge outside.</p>
<p>Tetrahedral, 109.5°, \( sp^3 \).</p>` },
        { pts: 1, q: R`At high pressure, which deviates more from ideal behavior, \( \ce{NH3} \) or HCl? Justify.`,
          a: R`<p>\( \ce{NH3} \). Its molecules hydrogen bond to each other (H on N), which outweighs the slightly larger dispersion forces of HCl. Stronger attractions lower the measured pressure more below the ideal value.</p>` }
      ] }
  ];

  window.EXAM = { title: 'Unit 3 test', mcq: mcq, frq: frq };
})();

</script>
<script>
/* exam.js — builds the test once at load; every press after that changes classes and text nodes only. */
(function () {
  'use strict';
  var E = window.EXAM, LET = 'ABCDEF';
  var mlist = document.getElementById('mlist'), flist = document.getElementById('flist');
  var mnav = document.getElementById('mnav'), fnav = document.getElementById('fnav');
  var tallyT = document.getElementById('tally').appendChild(document.createTextNode(''));
  var copyB = document.getElementById('copy'), resetB = document.getElementById('reset'), fallback = document.getElementById('fallback');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)');
  var KEY = 'unit3-test:v1', hoverQ = null;

  function make(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function glue(s) { return String(s).replace(/\\\)([.,;:!?])/g, '$1\\)'); }
  function plain(s) {
    return String(s).replace(/<[^>]+>/g, ' ').replace(/\\\(\s*|\s*\\\)/g, '$').replace(/\\\[\s*|\s*\\\]/g, '$$$$').replace(/[ \t]+/g, ' ').replace(/\s*\n\s*/g, ' ').trim();
  }
  function newSeed() { try { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0]; } catch (e) { return (Math.random() * 4294967296) >>> 0; } }
  function rng(seed) { return function () { seed = (seed + 0x6D2B79F5) | 0; var t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffled(n, rand) { var a = []; for (var i = 0; i < n; i++) a.push(i); for (var j = n - 1; j > 0; j--) { var k = Math.floor(rand() * (j + 1)), t = a[j]; a[j] = a[k]; a[k] = t; } return a; }
  function scroller() { return document.querySelector('.pane-r'); }
  function glideTo(node) {
    var sc = scroller(); if (!sc) return;
    var y = Math.max(0, sc.scrollTop + node.getBoundingClientRect().top - sc.getBoundingClientRect().top - sc.clientHeight * 0.12);
    if (reduce && reduce.matches) sc.scrollTop = y; else if (window.SmoothScroll && SmoothScroll.to) SmoothScroll.to(sc, y); else sc.scrollTo({ top: y, behavior: 'smooth' });
  }

  var state = null;
  try { state = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (!state || typeof state.seed !== 'number') state = { seed: newSeed(), picks: [], shown: [], frq: [] };
  state.picks = state.picks || []; state.shown = state.shown || []; state.frq = state.frq || [];
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  /* ── multiple choice ─────────────────────────────────────────────────── */
  var qs = E.mcq.map(function (d, i) {
    var li = make('li', 'mcq-q'); li.tabIndex = -1; li.id = 'q' + (i + 1);
    var num = make('span', 'mcq-n'); var numT = num.appendChild(document.createTextNode(''));
    var body = make('div', 'mcq-body');
    var text = make('div', 'mcq-text', glue(d.q));
    body.append(text);
    if (d.fig) { var fig = make('div', 'fig'); fig.innerHTML = d.fig; body.append(fig); }
    var opts = make('div', 'mcq-opts'); opts.setAttribute('role', 'group');
    var btns = d.options.map(function (o) {
      var b = make('button', 'mcq-opt'); b.type = 'button'; b.setAttribute('aria-pressed', 'false');
      var l = make('span', 'mcq-l'); b._l = l.appendChild(document.createTextNode(''));
      b.append(l, make('span', 'mcq-t', glue(o)));
      opts.append(b); return b;
    });
    var act = make('div', 'mcq-act');
    var show = make('button', 'textbtn', 'Show answer'); show.type = 'button';
    var cq = make('button', 'textbtn', 'Copy question'); cq.type = 'button';
    var cqf = make('textarea', 'mcq-fallback'); cqf.readOnly = true; cqf.hidden = true; cqf.setAttribute('aria-label', 'Question to copy');
    act.append(show, cq);
    var fb = make('p', 'mcq-fb'); fb.hidden = true; fb.setAttribute('aria-live', 'polite'); var fbT = fb.appendChild(document.createTextNode(''));
    var why = d.why ? make('p', 'mcq-why', glue(d.why)) : null; if (why) why.hidden = true;
    body.append(opts, act, cqf, fb); if (why) body.append(why);
    li.append(num, body);
    var a = make('a', 'mcq-nav-n'); a.href = '#' + li.id; var aT = a.appendChild(document.createTextNode(''));
    var q = { i: i, d: d, li: li, numT: numT, btns: btns, show: show, fb: fb, fbT: fbT, why: why, nav: a, navT: aT, perm: [], pick: -1, shown: false };
    li._q = q;
    btns.forEach(function (b, o) { b.addEventListener('click', function (e) { pick(q, o, e.detail === 0); }); });
    show.addEventListener('click', function () { reveal(q); });
    cq.addEventListener('click', function () {
      var lines = [q.numT.nodeValue + '. ' + plain(d.q) + (d.alt ? ' [Figure: ' + d.alt + ']' : '')];
      q.perm.forEach(function (o, j) { lines.push('   ' + LET[j] + '. ' + plain(d.options[o])); });
      var text = lines.join('\n'), label = cq.firstChild;
      function ok() { cqf.hidden = true; label.nodeValue = 'Copied'; setTimeout(function () { label.nodeValue = 'Copy question'; }, 1400); }
      function fail() { cqf.value = text; cqf.hidden = false; cqf.focus(); cqf.select(); }
      try { navigator.clipboard.writeText(text).then(ok, fail); } catch (e) { fail(); }
    });
    a.addEventListener('click', function (e) { e.preventDefault(); glideTo(li); li.focus({ preventScroll: true }); });
    li.addEventListener('pointerenter', function () { hoverQ = q; });
    li.addEventListener('pointerleave', function () { if (hoverQ === q) hoverQ = null; });
    return q;
  });
  var order = [];

  function arrange() {
    var rand = rng(state.seed);
    order = shuffled(qs.length, rand).map(function (i) { return qs[i]; });
    qs.forEach(function (q) { q.perm = shuffled(q.btns.length, rand); });
    order.forEach(function (q, p) {
      mlist.append(q.li); mnav.append(q.nav);
      q.numT.nodeValue = String(p + 1); q.navT.nodeValue = String(p + 1);
      var opts = q.btns[0].parentNode;
      q.perm.forEach(function (o, j) { opts.append(q.btns[o]); q.btns[o]._l.nodeValue = LET[j]; });
    });
  }
  function mark(q) {
    var right = q.pick === q.d.answer;
    q.li.classList.toggle('is-done', q.shown);
    q.btns.forEach(function (b, o) {
      b.classList.toggle('is-picked', o === q.pick);
      b.setAttribute('aria-pressed', o === q.pick ? 'true' : 'false');
      b.classList.toggle('is-answer', q.shown && o === q.d.answer);
      if (q.shown) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled');
    });
    var A = LET[q.perm.indexOf(q.d.answer)];
    q.fbT.nodeValue = !q.shown ? '' : q.pick < 0 ? 'The answer is ' + A + '.' : right ? 'Correct.' : 'Incorrect. The answer is ' + A + '.';
    q.fb.hidden = !q.shown; q.show.hidden = q.shown;
    if (q.why) q.why.hidden = !q.shown;
    q.nav.classList.toggle('is-picked', q.pick >= 0 && !q.shown);
    q.nav.classList.toggle('is-right', q.shown && right);
    q.nav.classList.toggle('is-wrong', q.shown && !right);
  }
  function tally() {
    var picked = 0, shown = 0, right = 0;
    qs.forEach(function (q) { if (q.pick >= 0) picked++; if (q.shown) { shown++; if (q.pick === q.d.answer) right++; } });
    tallyT.nodeValue = picked + ' of ' + qs.length + ' answered' + (shown ? ' · ' + right + ' of ' + shown + ' correct' : '');
    state.picks = qs.map(function (q) { return q.pick; });
    state.shown = qs.map(function (q) { return q.shown ? 1 : 0; });
    save();
  }
  function nextOf(q) {
    var p = order.indexOf(q);
    var rest = order.slice(p + 1).filter(function (x) { return x.pick < 0 && !x.shown; });
    return rest[0] || null;
  }
  function pick(q, o, keyboard) {
    if (q.shown) return;
    q.pick = o; mark(q); tally();
    if (keyboard) { var n = nextOf(q); if (n) { n.li.focus({ preventScroll: true }); glideTo(n.li); } else q.li.focus({ preventScroll: true }); }
    else q.li.focus({ preventScroll: true });
  }
  function reveal(q) { if (q.shown) return; q.shown = true; mark(q); tally(); q.li.focus({ preventScroll: true }); }

  /* ── free response ───────────────────────────────────────────────────── */
  var parts = [];
  E.frq.forEach(function (f, fi) {
    var li = make('li', 'frq'); li.id = 'f' + (fi + 1); li.tabIndex = -1;
    var head = make('div', 'frq-head');
    head.append(make('span', 'mcq-n', String(fi + 1)), make('span', 'frq-title', f.title));
    var total = f.parts.reduce(function (s, p) { return s + p.pts; }, 0);
    head.append(make('span', 'frq-pts', total + ' points'));
    var stem = make('div', 'frq-stem'); stem.innerHTML = f.stem;
    var ol = make('ol', 'frq-parts');
    f.parts.forEach(function (p, pi) {
      var pl = make('li', 'frq-part');
      var lab = make('span', 'frq-l', 'abcdefgh'[pi]);
      var pb = make('div', 'frq-pb');
      var pq = make('p', 'frq-q', glue(p.q));
      pq.append(make('span', 'frq-p', ' (' + p.pts + (p.pts === 1 ? ' point)' : ' points)')));
      var btn = make('button', 'textbtn', 'Show answer'); btn.type = 'button';
      var ans = make('div', 'frq-ans'); ans.innerHTML = p.a; ans.hidden = true;
      pb.append(pq, btn, ans); pl.append(lab, pb); ol.append(pl);
      var part = { btn: btn, ans: ans, k: fi + '.' + pi };
      btn.addEventListener('click', function () { part.ans.hidden = false; part.btn.hidden = true; if (state.frq.indexOf(part.k) < 0) state.frq.push(part.k); save(); });
      parts.push(part);
    });
    li.append(head, stem, ol); flist.append(li);
    var a = make('a', 'mcq-nav-n', String(fi + 1)); a.href = '#' + li.id;
    a.addEventListener('click', function (e) { e.preventDefault(); glideTo(li); li.focus({ preventScroll: true }); });
    fnav.append(a);
  });

  /* ── copy, start over ────────────────────────────────────────────────── */
  copyB.addEventListener('click', function () {
    var lines = ['AP Chemistry, Unit 3 test (intermolecular forces, gases, solutions, spectroscopy). My multiple-choice answers are below; for each question you get my choice and the correct choice. Explain what I got wrong and the idea I am missing.', ''];
    var right = 0, done = 0;
    order.forEach(function (q, p) {
      var d = q.d;
      lines.push((p + 1) + '. ' + plain(d.q) + (d.alt ? ' [Figure: ' + d.alt + ']' : ''));
      var C = LET[q.perm.indexOf(d.answer)];
      if (q.pick < 0) lines.push('   My answer: none');
      else { done++; if (q.pick === d.answer) right++; lines.push('   My answer: ' + LET[q.perm.indexOf(q.pick)] + '. ' + plain(d.options[q.pick]) + (q.pick === d.answer ? ' (correct)' : ' (incorrect)')); }
      lines.push('   Correct answer: ' + C + '. ' + plain(d.options[d.answer]));
      lines.push('');
    });
    lines.push('Score: ' + right + ' of ' + qs.length + ' (' + (qs.length - done) + ' unanswered)');
    var text = lines.join('\n'), label = copyB.firstChild, was = 'Copy answers';
    function ok() { fallback.hidden = true; label.nodeValue = 'Copied'; setTimeout(function () { label.nodeValue = was; }, 1400); }
    function fail() { fallback.value = text; fallback.hidden = false; fallback.focus(); fallback.select(); }
    try { navigator.clipboard.writeText(text).then(ok, fail); } catch (e) { fail(); }
  });

  var armed = false, armT = 0;
  resetB.addEventListener('click', function () {
    var label = resetB.firstChild;
    if (!armed) { armed = true; label.nodeValue = 'Clear all answers?'; clearTimeout(armT); armT = setTimeout(function () { armed = false; label.nodeValue = 'Start over'; }, 3000); return; }
    armed = false; clearTimeout(armT); label.nodeValue = 'Start over';
    qs.forEach(function (q) { q.pick = -1; q.shown = false; mark(q); });
    parts.forEach(function (p) { p.ans.hidden = true; p.btn.hidden = false; });
    state = { seed: newSeed(), picks: [], shown: [], frq: [] };
    arrange(); tally();
    var sc = scroller(); if (sc) { if (window.SmoothScroll && SmoothScroll.to && !(reduce && reduce.matches)) SmoothScroll.to(sc, 0); else sc.scrollTop = 0; }
  });

  /* ── keys: A–D or 1–4 pick for the question in focus, under the pointer, or first open on screen ─ */
  function current() {
    var a = document.activeElement, li = a && a.closest && a.closest('.mcq-q'), q = li && li._q;
    if (q && !q.shown) return q;
    if (hoverQ && !hoverQ.shown) return hoverQ;
    for (var i = 0; i < order.length; i++) {
      var x = order[i], r = x.li.getBoundingClientRect();
      if (!x.shown && x.pick < 0 && r.bottom > 40 && r.top < innerHeight - 40) return x;
    }
    return null;
  }
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey || e.repeat || e.defaultPrevented) return;
    var a = document.activeElement;
    if (a && (a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) return;
    var j = e.key.length === 1 ? LET.indexOf(e.key.toUpperCase()) : -1;
    if (j < 0 && /^[1-6]$/.test(e.key)) j = +e.key - 1;
    if (j < 0) return;
    var q = current(); if (!q || j >= q.btns.length) return;
    e.preventDefault(); pick(q, q.perm[j], true);
  });

  /* ── restore ─────────────────────────────────────────────────────────── */
  arrange();
  qs.forEach(function (q, i) {
    var p = state.picks[i]; if (typeof p === 'number' && p >= 0 && p < q.btns.length) q.pick = p;
    q.shown = !!state.shown[i]; mark(q);
  });
  parts.forEach(function (p) { if (state.frq.indexOf(p.k) >= 0) { p.ans.hidden = false; p.btn.hidden = true; } });
  tally();

  var MJ = window.MathJax, root = document.getElementById('app');
  function typeset() { if (MJ && MJ.typesetPromise) MJ.typesetPromise([root]).catch(function () {}); }
  if (MJ && MJ.startup && MJ.startup.promise) MJ.startup.promise.then(typeset); else typeset();
})();

</script>
<script>
/* minimono.js — the house style's behavior. Include before </body>; no init.
   1. Two panes or one. Full-screen shows both (left ¼ · right ¾). The page
      goes to one pane when the window isn't full-screen, or when the person
      hides the left pane (`, or the pane's own "Hide"). Hiding is
      remembered. Force the layout with <html data-layout="split|single">.
   2. In one-pane mode the "Menu" link (.menu-hint) is invisible until the
      pointer enters the top-left zone (left quarter, top sixth); clicking it,
      or `, opens the left pane as an overlay. Esc, a click outside, or
      choosing a row closes it. With no pointer (touch), the link stays shown.
      The overlay is the SAME .pane-l element, moved by a class — never a
      copy, never rebuilt — so its scroll position and selection survive.
   3. Safari: trackpad pinch-zoom is blocked; ⌘+ / ⌘− still work.          */
(function () {
  'use strict';
  var html = document.documentElement;
  var KEY = 'minimono:pane-hidden';
  var hidden = false;
  try { hidden = localStorage.getItem(KEY) === '1'; } catch (e) {}

  /* 1. Two panes or one ---------------------------------------------------- */
  function isFull() {
    var forced = html.getAttribute('data-layout');
    if (forced === 'split') return true;
    if (forced === 'single') return false;
    // Full-screen or maximized. At the top level, measure the window itself
    // (outerWidth): ⌘+ zoom shrinks innerWidth but not the window. Embedded
    // in a frame, the frame's own width is what's available.
    var top = true;
    try { top = window.top === window; } catch (e) { top = false; }
    var w = top && outerWidth > 0 ? outerWidth : innerWidth;
    return w >= screen.availWidth - 24;
  }
  function layout() {
    var windowed = !isFull();
    html.classList.toggle('is-windowed', windowed);
    var single = windowed || hidden;
    if (single !== html.classList.contains('is-single')) {
      if (!single) close(true);
      html.classList.toggle('is-single', single);
    }
  }
  function setHidden(v) {
    hidden = v;
    try { localStorage.setItem(KEY, v ? '1' : '0'); } catch (e) {}
    close(true);
    layout();
  }
  var raf = 0;
  addEventListener('resize', function () { if (!raf) raf = requestAnimationFrame(function () { raf = 0; layout(); }); });
  new MutationObserver(layout).observe(html, { attributes: true, attributeFilter: ['data-layout'] });

  /* 2. The overlay --------------------------------------------------------- */
  var lastFocus = null;
  function pane() { return document.querySelector('.pane-l'); }
  function typing(el) {
    if (!el || el === document.body) return false;
    if (el.isContentEditable) return true;
    if (el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') return true;
    return el.tagName === 'INPUT' && !/^(button|submit|reset|checkbox|radio|range|color|file|image)$/i.test(el.type);
  }
  function single() { return html.classList.contains('is-single'); }
  function isOpen() { return html.classList.contains('menu-open'); }
  function open(keyboard) {
    if (!single() || isOpen()) return;
    html.classList.remove('hint-on');
    html.classList.add('menu-open');
    lastFocus = document.activeElement;
    if (keyboard) {                                   // keyboard: move focus in
      var p = pane(), cur = p && (p.querySelector('[aria-current="true"]') || p.querySelector('a,button,input,[tabindex]'));
      if (cur) cur.focus({ preventScroll: true });
    }
  }
  function close(silent) {
    if (!isOpen()) return;
    html.classList.remove('menu-open');
    var p = pane();
    if (!silent && lastFocus && lastFocus.focus && lastFocus !== document.body) lastFocus.focus({ preventScroll: true });
    else if (p && p.contains(document.activeElement)) document.activeElement.blur();
    lastFocus = null;
  }

  // the top-left zone: left quarter of the width, top sixth of the height.
  // Entering it shows the menu link; nothing opens until the link is clicked.
  function inZone(x, y) { return x <= innerWidth / 4 && y <= innerHeight / 6; }
  var hintTimer = 0;
  function hint(on) {
    clearTimeout(hintTimer);
    if (on) { html.classList.add('hint-on'); return; }
    hintTimer = setTimeout(function () { html.classList.remove('hint-on'); }, 200);
  }
  addEventListener('pointermove', function (e) {
    if (e.pointerType !== 'mouse') return;
    hint(single() && !isOpen() && inZone(e.clientX, e.clientY));
  }, { passive: true });
  document.addEventListener('mouseleave', function () { hint(false); });

  addEventListener('keydown', function (e) {
    // ` (backtick) on its own — left alone while typing in a field
    if (e.key === '`' && !e.metaKey && !e.ctrlKey && !e.altKey && !typing(document.activeElement)) {
      e.preventDefault();
      if (html.classList.contains('is-windowed')) { isOpen() ? close() : open(true); }
      else setHidden(!hidden);                        // full-screen: hide, or dock it again
      return;
    }
    if (e.key === 'Escape' && isOpen()) { e.preventDefault(); close(); }
  });
  addEventListener('pointerdown', function (e) {
    if (!isOpen()) return;
    var p = pane();
    if (p && !p.contains(e.target) && !(e.target.closest && e.target.closest('.menu-hint'))) close();
  });
  addEventListener('click', function (e) {
    var t = e.target.closest ? e.target : e.target.parentElement;
    if (t.closest('.menu-hint')) { e.preventDefault(); isOpen() ? close() : open(false); return; }
    if (t.closest('.pane-hide')) {                    // docked: "Hide" · hidden overlay: "Keep open"
      e.preventDefault(); setHidden(!hidden); return;
    }
    if (isOpen() && t.closest('.pane-l .row, .pane-l .mcq-nav a')) close();
  });

  /* Focus rings: only after Tab. Shift, arrows, Space and clicks never show one. */
  addEventListener('keydown', function (e) { if (e.key === 'Tab') html.classList.add('kbd-nav'); }, true);
  addEventListener('pointerdown', function () { html.classList.remove('kbd-nav'); }, true);

  /* 3. Safari pinch-zoom ---------------------------------------------------- */
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });

  layout();
  window.Minimono = {
    open: function () { open(true); }, close: close,
    hide: function () { setHidden(true); }, show: function () { setHidden(false); },
    relayout: layout
  };
})();

</script>
<script>
/* smooth-scroll.js — Safari's keyboard scrolling, for every pane.
   ---------------------------------------------------------------------------
   A port of WebKit's keyboard-scroll physics (ScrollAnimationKeyboard.cpp,
   KeyboardScroll.h, macOS constants) so Space, arrows, Page Up/Down and
   Home/End glide and settle on a spring in every scroller — the page, and
   each two-pane split pane on its own.

     ↑ / ↓            tap: glide one line (40px) · hold: accelerate to
                      1000px/s in 0.2s, cruise, then the spring carries the
                      leftover momentum and settles
     Space / ⇧Space   the same, with a page as the step (the visible height
     PgDn / PgUp      less 40px of overlap, never less than 87.5% of it):
                      tap glides at least a page, hold accelerates
     Home / End       glide to the top / bottom (also ⌘↑ / ⌘↓ on a Mac)
   Key repeats are ignored while a key is held, as in WebKit.

   Which scroller moves: the one under the pointer, else the one that holds
   focus, else the last one clicked, else the page.
   Left alone: any control that uses these keys itself — text fields,
   sliders, radio groups, selects, contenteditable, tabs, listboxes — and
   Space on a button, link, checkbox or anything else Space activates. Any key with ⌥/⌃
   (and ⌘ except ⌘↑/⌘↓) passes through.
   Respects prefers-reduced-motion: the same steps, applied instantly.
   No init call — include before </body>. ~3KB. Exposes window.SmoothScroll.  */
(function () {
  'use strict';
  if (window.SmoothScroll) return;

  /* WebKit macOS KeyboardScrollParameters */
  var MASS = 1, STIFF = 175, DAMP = 20, MAX_VEL_MULT = 25, TIME_TO_MAX = 0.2;
  var LINE = 40;                         /* Scrollbar::pixelsPerLineStep()          */
  var PAGE_MIN_FRACTION = 0.875;         /* Scrollbar::minFractionToStepWhenPaging  */
  var PAGE_OVERLAP = 40;                 /* Scrollbar::maxOverlapBetweenPages        */

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)');
  var docEl = function () { return document.scrollingElement || document.documentElement; };

  function canScroll(el) {
    if (el === docEl()) return el.scrollHeight > el.clientHeight;
    var s = getComputedStyle(el), o = s.overflowY;
    return (o === 'auto' || o === 'scroll' || o === 'overlay') && el.scrollHeight > el.clientHeight + 1;
  }
  function scrollerFrom(node) {
    for (var el = node; el && el.nodeType === 1; el = el.parentElement) {
      if (el === document.body || el === document.documentElement) break;
      if (canScroll(el)) return el;
    }
    return canScroll(docEl()) ? docEl() : null;
  }

  var hovered = null, clicked = null;
  addEventListener('pointermove', function (e) { if (e.pointerType === 'mouse') hovered = e.target; }, { passive: true });
  addEventListener('pointerdown', function (e) { clicked = e.target; }, { passive: true });
  document.addEventListener('mouseleave', function () { hovered = null; });

  function pickScroller() {
    var a = document.activeElement;
    return (hovered && scrollerFrom(hovered)) ||
           (a && a !== document.body && scrollerFrom(a)) ||
           (clicked && scrollerFrom(clicked)) ||
           scrollerFrom(document.body);
  }

  // controls that use arrows / Page / Home / End themselves keep them
  function ownsKeys(el) {
    if (!el || el === document.body) return false;
    if (el.isContentEditable) return true;
    var t = el.tagName;
    if (t === 'TEXTAREA' || t === 'SELECT') return true;
    if (t === 'INPUT') return !/^(button|submit|reset|checkbox|color|file|image)$/i.test(el.type);
    var r = el.getAttribute && el.getAttribute('role');
    return !!r && /^(slider|spinbutton|radio|radiogroup|tab|tablist|listbox|option|menu|menubar|menuitem|combobox|grid|tree|treeitem|textbox)$/.test(r);
  }
  function spaceActivates(el) {
    if (!el || el === document.body) return false;
    if (/^(BUTTON|A|SUMMARY|INPUT)$/.test(el.tagName)) return true;
    var r = el.getAttribute && el.getAttribute('role');
    return !!r && /^(button|link|tab|checkbox|radio|switch|menuitem|option|slider)$/.test(r);
  }

  /* One animator per scroller ------------------------------------------- */
  var anims = new WeakMap();
  function Anim(el) {
    this.el = el; this.pos = el.scrollTop; this.vel = 0;
    this.held = null; this.ideal = this.pos; this.minTravel = this.pos;
    this.raf = 0; this.last = 0;
  }
  Anim.prototype.max = function () { return this.el.scrollHeight - this.el.clientHeight; };
  Anim.prototype.sync = function () {
    // the user may have scrolled by wheel/trackpad since we last moved it
    if (!this.raf) { this.pos = this.el.scrollTop; this.ideal = this.pos; this.vel = 0; }
  };
  Anim.prototype.run = function () {
    if (this.raf) return;
    var self = this; this.last = performance.now();
    this.raf = requestAnimationFrame(function f(t) { self.step(t) ? (self.raf = requestAnimationFrame(f)) : (self.raf = 0); });
  };
  Anim.prototype.stop = function () { if (this.raf) cancelAnimationFrame(this.raf); this.raf = 0; this.vel = 0; this.held = null; };
  Anim.prototype.write = function () {
    var max = this.max();
    if (this.pos <= 0 || this.pos >= max) {          // hit an edge: stop there, no overshoot
      this.pos = Math.min(Math.max(this.pos, 0), max);
      this.vel = 0; this.ideal = this.pos;
      this.el.scrollTop = this.pos;
      return false;
    }
    this.el.scrollTop = this.pos;
    return true;
  };
  /* ScrollAnimationKeyboard::animateScroll */
  Anim.prototype.step = function (t) {
    var dt = (t - this.last) / 1000; this.last = t;
    if (dt <= 0) return true;
    if (dt > 0.05) dt = 0.05;                          // a stalled frame shouldn't fling
    var force = 0, spring = true, ideal = this.ideal;
    if (this.held) {
      force = this.held.force; spring = false; ideal = this.pos;
      if (Math.abs(this.vel) >= Math.abs(this.held.maxVel)) force = 0;
    }
    var disp = this.pos - ideal;
    if (spring) force -= disp * STIFF + this.vel * DAMP;
    this.vel += force / MASS * dt;
    this.pos += this.vel * dt;
    var inside = this.write();
    if (spring && disp * (this.pos - ideal) < 0) { this.vel = 0; this.pos = ideal; this.el.scrollTop = ideal; }
    if (!inside && !this.held) return false;
    if (!this.held && this.vel * this.vel < 1 && Math.abs(this.pos - ideal) < 0.5) { this.vel = 0; return false; }
    return true;
  };
  /* startKeyboardScroll — velocity carries over, like WebKit */
  Anim.prototype.hold = function (dir, step) {
    var maxVel = step * MAX_VEL_MULT * dir;
    this.held = { dir: dir, maxVel: maxVel, force: maxVel * MASS / TIME_TO_MAX };
    this.minTravel = this.pos + step * dir;
    this.run();
  };
  /* stopKeyboardScrollAnimation */
  Anim.prototype.release = function () {
    if (!this.held) return;
    var d = Math.sqrt(this.vel * this.vel * MASS / STIFF) * (this.vel < 0 ? -1 : 1);
    var settle = this.pos + d;
    this.ideal = this.held.dir > 0 ? Math.max(settle, this.minTravel) : Math.min(settle, this.minTravel);
    this.ideal = Math.round(Math.min(Math.max(this.ideal, 0), this.max()));
    this.held = null;
    this.run();
  };
  /* a jump to a target (top / bottom, or the public API): spring there */
  Anim.prototype.to = function (target) {
    var base = this.raf && !this.held ? this.ideal : this.pos;
    if (typeof target === 'function') target = target(base);
    this.held = null;
    this.ideal = Math.round(Math.min(Math.max(target, 0), this.max()));
    this.run();
  };

  function anim(el) { var a = anims.get(el); if (!a) { a = new Anim(el); anims.set(el, a); } a.sync(); return a; }
  function pageStep(el) {
    var h = el === docEl() ? innerHeight : el.clientHeight;
    return Math.max(h * PAGE_MIN_FRACTION, h - PAGE_OVERLAP);
  }

  var heldKey = null, heldAnim = null;
  function releaseHeld() { if (heldAnim) heldAnim.release(); heldKey = heldAnim = null; }

  addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.altKey || e.ctrlKey) return;
    var k = e.key, cmdArrow = e.metaKey && (k === 'ArrowUp' || k === 'ArrowDown');
    if (e.metaKey && !cmdArrow) return;
    if (!/^( |ArrowUp|ArrowDown|PageUp|PageDown|Home|End)$/.test(k)) return;
    var act = document.activeElement;
    if (ownsKeys(act)) return;
    if (k === ' ' && spaceActivates(act)) return;
    if ((k === 'ArrowUp' || k === 'ArrowDown') && e.shiftKey && !cmdArrow) return;   // leave selection alone

    var el = pickScroller(); if (!el) return;
    e.preventDefault();
    var edge = cmdArrow || k === 'Home' || k === 'End';
    if (!edge && (e.repeat || heldKey)) return;                // WebKit ignores repeats and other keys while one is held
    var a = anim(el), page = pageStep(el);

    if (reduce && reduce.matches) {                       // same steps, no animation
      a.stop();
      var dy = k === 'ArrowDown' ? LINE : k === 'ArrowUp' ? -LINE :
               (k === ' ' && !e.shiftKey) || k === 'PageDown' ? page : page * -1;
      if (k === 'Home' || (cmdArrow && k === 'ArrowUp')) el.scrollTop = 0;
      else if (k === 'End' || (cmdArrow && k === 'ArrowDown')) el.scrollTop = el.scrollHeight;
      else el.scrollTop += dy;
      return;
    }

    if (edge) {
      a.to(k === 'Home' || k === 'ArrowUp' ? 0 : a.max());
    } else if (k === 'ArrowUp' || k === 'ArrowDown') {
      heldKey = k; heldAnim = a; a.hold(k === 'ArrowDown' ? 1 : -1, LINE);
    } else {
      heldKey = k; heldAnim = a;
      a.hold((k === ' ' && !e.shiftKey) || k === 'PageDown' ? 1 : -1, page);
    }
  });
  addEventListener('keyup', function (e) { if (e.key === heldKey) releaseHeld(); });
  addEventListener('blur', releaseHeld);
  document.addEventListener('visibilitychange', function () { if (document.hidden) releaseHeld(); });
  /* a wheel/trackpad scroll takes over from a gliding key scroll */
  addEventListener('wheel', function (e) {
    var el = scrollerFrom(e.target), a = el && anims.get(el);
    if (a && a.raf && !a.held) a.stop();
  }, { passive: true });

  window.SmoothScroll = {
    /* programmatic glide, e.g. SmoothScroll.to(pane, 0) to send a pane home */
    to: function (el, y) { anim(el || docEl()).to(y); },
    by: function (el, dy) { var a = anim(el || docEl()); a.to(function (b) { return b + dy; }); }
  };
})();

</script>
