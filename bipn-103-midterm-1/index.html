<style>
/* minimono.css — the house style's base: tokens, type, the two-pane layout,
   the windowed overlay, and flat native controls.
   Targets two screens: MacBook Air 15" (1710×1107, 2×) and Dell P2423D
   (2560×1440, 1×). Every line is 1px — half-pixels vanish on the Dell.     */

/* ── Tokens ─────────────────────────────────────────────────────────────── */
:root{
  color-scheme: light dark;            /* native controls + scrollbars follow the theme */
  --ground:#EEF1F4; --wall:#ffffff;
  --ink:#0a0a0b; --ink-soft:#5F6368; --muted:#9c9ca3;
  --hair:rgba(10,10,12,.13); --hair-soft:rgba(10,10,12,.08);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;
  --pane-l:25%;                        /* the left pane is one quarter, always */
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#000000; --wall:#161618; --ink:#f6f6f8; --ink-soft:#a0a0a8; --muted:#67676f;
  --hair:rgba(255,255,255,.16); --hair-soft:rgba(255,255,255,.09);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#000000; --wall:#161618; --ink:#f6f6f8; --ink-soft:#a0a0a8; --muted:#67676f;
  --hair:rgba(255,255,255,.16); --hair-soft:rgba(255,255,255,.09);
}
:root[data-theme="light"]{ color-scheme: light; }

/* ── Base ───────────────────────────────────────────────────────────────── */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; overflow:hidden; }
body{
  background:var(--ground); color:var(--ink);
  font:16px/1.5 var(--sans); -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
:focus, :focus-visible{ outline:none; }
/* focus shows only after Tab (minimono.js sets .kbd-nav; any click clears it),
   as a thin grey line — never a bright ring, never from Shift or a click */
html.kbd-nav :focus-visible{ outline:1px solid var(--muted); outline-offset:3px; border-radius:6px; }
/* text selection keeps the system highlight — never restyle ::selection */
a{ color:inherit; text-decoration:none; }
/* scrollbars: left to macOS — overlay, thin, shown while scrolling. Never hidden. */

/* ── Type (tuned for 1710 and 2560 wide). Weights: 300 · 400 · 500, never more ─ */
.hero { font-size:clamp(64px, 4.6vw, 112px); font-weight:300; line-height:1.02; letter-spacing:-.035em; margin:0; }
.h2   { font-size:clamp(28px, 1.9vw, 40px);  font-weight:500; line-height:1.15; letter-spacing:-.02em; margin:0; }
.text { font-size:clamp(17px, 1.05vw, 20px); line-height:1.55; max-width:68ch; }
.label{ font-size:13px; font-weight:500; color:var(--ink-soft); letter-spacing:.005em; }
.num  { font-weight:400; letter-spacing:-.02em; }

/* ── Layout: two panes, left ¼ · right ¾, each its own scroller ─────────── */
#app{ display:flex; height:100dvh; }
.pane-l{
  flex:0 0 var(--pane-l); height:100%; overflow-y:auto; overscroll-behavior:contain;
  border-right:1px solid var(--hair-soft); background:var(--ground);
  padding:48px 32px 64px;
}
.pane-r{ flex:1 1 auto; min-width:0; height:100%; overflow-y:auto; overscroll-behavior:contain; }
.pane-r .body{ max-width:1120px; padding:56px clamp(48px, 5vw, 120px) 120px; }

/* the list in the left pane */
.row{
  display:block; width:100%; padding:14px 0; border-bottom:1px solid var(--hair-soft);
  font-size:clamp(17px, 1.15vw, 22px); color:var(--ink-soft); cursor:pointer;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.row:last-child{ border-bottom:0; }
@media (hover:hover){ .row:hover{ color:var(--ink); } }
.row[aria-current="true"]{ color:var(--ink); font-weight:500; }
.row:active{ opacity:.6; }

/* ── One-pane mode: windowed, or the person hid the left pane ────────────
   The left pane leaves the layout; it comes back as an overlay (the SAME
   element, moved) when the pointer enters the top-left zone — the left
   quarter of the width, the top sixth of the height — or on `.           */
.pane-hide{
  border:0; background:none; padding:4px 0; margin:0;
  font:inherit; font-size:13px; color:var(--ink-soft); cursor:pointer; text-align:left;
}
.pane-hide kbd{ font:inherit; color:var(--muted); margin-left:6px; }
.pane-hide .keep{ display:none; }
html.is-single .pane-hide .hide{ display:none; }
html.is-single .pane-hide .keep{ display:inline; }
html.is-windowed .pane-hide{ display:none; }        /* windowed: the overlay is the only way it shows */
@media (hover:hover){ .pane-hide:hover{ color:var(--ink); } }
.menu-hint{ display:none; }
/* one-pane mode: the link sits in the top-left zone, invisible until the
   pointer enters that zone (or it takes keyboard focus); always shown on touch */
html.is-single .menu-hint{
  display:block; position:fixed; z-index:15;
  top:calc(env(safe-area-inset-top, 0px) + 18px); left:max(16px, env(safe-area-inset-left, 0px), 2vw);
  padding:6px 10px; margin:0; border-radius:8px; background:var(--ground);
  font-size:13px; color:var(--ink-soft); cursor:pointer;
  opacity:0; pointer-events:none; transition:opacity .14s ease;
}
html.is-single .menu-hint kbd{ font:inherit; color:var(--muted); margin-left:6px; }
html.is-single.hint-on .menu-hint,
html.kbd-nav.is-single .menu-hint:focus-visible{ opacity:1; pointer-events:auto; }
@media (hover:none){ html.is-single .menu-hint{ opacity:1; pointer-events:auto; } }
@media (hover:hover){ html.is-single .menu-hint:hover{ color:var(--ink); } }

html.is-single .pane-l{
  position:fixed; z-index:20; inset:0 auto 0 0; width:clamp(280px, 25vw, 640px);
  transform:translateX(-100%); visibility:hidden;
  transition:transform .22s cubic-bezier(.32,.72,0,1), visibility 0s linear .22s;
}
html.is-single.menu-open .pane-l{
  transform:none; visibility:visible; border-right:1px solid var(--hair);
  transition:transform .22s cubic-bezier(.32,.72,0,1), visibility 0s;
}

/* ── Controls: native elements, flat ────────────────────────────────────── */
/* slider + checkbox + radio take ink through accent-color, natively */
input[type="range"], input[type="checkbox"], input[type="radio"]{ accent-color:var(--ink); }
input[type="range"]{ width:100%; max-width:420px; cursor:pointer; }

/* toggle: a checkbox with role="switch", drawn flat */
input[type="checkbox"][role="switch"]{
  -webkit-appearance:none; appearance:none; margin:0; flex:none; cursor:pointer;
  position:relative; width:40px; height:24px; border-radius:999px;
  background:var(--hair); transition:background .16s ease;
}
input[type="checkbox"][role="switch"]::before{
  content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:999px;
  background:var(--ground); transition:transform .18s cubic-bezier(.32,.72,0,1);
}
input[type="checkbox"][role="switch"]:checked{ background:var(--ink); }
input[type="checkbox"][role="switch"]:checked::before{ transform:translateX(16px); }

/* segmented choice: a radio group; the chosen one is heavier ink + a 2px mark */
.seg{ display:inline-flex; gap:28px; border:0; padding:0; margin:0; }
.seg label{ position:relative; cursor:pointer; padding:6px 0; color:var(--ink-soft); font-weight:400; }
.seg input{ position:absolute; opacity:0; width:1px; height:1px; }
.seg input:checked + span{ color:var(--ink); font-weight:500; }
.seg input:checked + span::after{
  content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--ink); border-radius:2px;
}
html.kbd-nav .seg input:focus-visible + span{ outline:1px solid var(--muted); outline-offset:4px; border-radius:6px; }
@media (hover:hover){ .seg label:hover span{ color:var(--ink); } }

/* search */
input[type="search"]{
  -webkit-appearance:none; appearance:none; width:100%; max-width:420px;
  font:inherit; font-size:16px; color:var(--ink);
  background:var(--wall); border:0; border-radius:10px; padding:10px 14px;
}
input[type="search"]::placeholder{ color:var(--muted); }

/* buttons: only for real actions — navigation is text */
button{ font:inherit; cursor:pointer; }
.btn{ border:0; border-radius:10px; padding:10px 18px; font-weight:500; background:var(--wall); color:var(--ink); }
.btn.primary{ background:var(--ink); color:var(--ground); }
.btn:active{ opacity:.6; }

/* ── Multiple-choice questions (quiz.js builds them from JSON) ─────────────
   State without color: the right answer gets an ink bar and Medium weight,
   a wrong pick is struck through, everything else recedes to grey. */
.mcq-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:44px; max-width:760px; }
.mcq-q{ display:grid; grid-template-columns:2em minmax(0, 1fr); column-gap:10px; outline-offset:8px; }
.mcq-n{ font-size:clamp(19px, 1.25vw, 24px); line-height:1.45; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.mcq-body{ display:flex; flex-direction:column; gap:12px; min-width:0; }
.mcq-text{ margin:0; font-size:clamp(19px, 1.25vw, 24px); line-height:1.45; color:var(--ink); }
.mcq-text mjx-container[display="true"]{ margin:.5em 0 !important; }
.mcq-opts{ display:flex; flex-direction:column; gap:2px; }
.mcq-opt{
  display:grid; grid-template-columns:1.5em minmax(0, 1fr); align-items:baseline; gap:8px;
  width:calc(100% + 20px); margin:0 -10px; padding:9px 10px; border:0; border-radius:8px;
  background:none; text-align:left; font:inherit; font-size:clamp(17px, 1.05vw, 20px); line-height:1.45;
  color:var(--ink); cursor:pointer;
}
.mcq-l{ color:var(--ink-soft); font-variant-numeric:tabular-nums; }
@media (hover:hover){ .mcq-q:not(.is-done) .mcq-opt:hover{ background:var(--wall); } }
.mcq-q:not(.is-done) .mcq-opt:active{ opacity:.6; }
.mcq-q.is-done .mcq-opt{ cursor:default; color:var(--ink-soft); }
.mcq-q.is-done .mcq-opt.is-answer{ color:var(--ink); font-weight:500; box-shadow:inset 2px 0 0 var(--ink); }
.mcq-q.is-done .mcq-opt.is-answer .mcq-l{ color:var(--ink); }
.mcq-q.is-done .mcq-opt.is-chosen:not(.is-answer) .mcq-t{ text-decoration:line-through; text-decoration-thickness:1px; }
.mcq-fb{ margin:6px 0 0; font-size:17px; font-weight:500; color:var(--ink); }
.mcq-why{ margin:0; font-size:17px; line-height:1.5; color:var(--ink-soft); max-width:62ch; }
.mcq-bar{ display:flex; align-items:center; flex-wrap:wrap; gap:12px; margin-top:44px; }
.mcq-score{ font-size:15px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.mcq-fallback{ width:100%; max-width:760px; min-height:160px; margin-top:16px; font:14px/1.5 var(--sans); color:var(--ink);
  background:var(--wall); border:0; border-radius:10px; padding:12px 14px; }
/* the question numbers, in the left pane of a quiz page */
.mcq-nav{ display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:4px; }
.mcq-nav a{ display:block; padding:8px 0; border-radius:8px; text-align:center; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
@media (hover:hover){ .mcq-nav a:hover{ background:var(--wall); color:var(--ink); } }
.mcq-nav a.is-right{ color:var(--ink); text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:.25em; }
.mcq-nav a.is-wrong{ color:var(--ink); text-decoration:line-through; text-decoration-thickness:1px; }
/* fractions stay full size inline */
mjx-container[jax="SVG"]:not([display="true"]){ margin:0 .08em; }

/* ── Loading: the one color exception — a thin rainbow ring, only while loading */
.loading{
  width:18px; height:18px; border-radius:50%;
  background:conic-gradient(#ff3b30,#ff9500,#ffcc00,#34c759,#00c7be,#007aff,#af52de,#ff3b30);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
          mask:radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
  animation:mm-spin .9s linear infinite;
}
@keyframes mm-spin{ to{ transform:rotate(1turn); } }

@media (prefers-reduced-motion:reduce){
  *{ animation:none!important; transition:none!important; }
}

/* ── This page: a course, two timed tests, MCQs then FRQs ─────────────── */
[hidden]{ display:none!important; }
.pane-r{ position:relative; }
.course{ display:flex; flex-direction:column; gap:6px; margin:28px 0 30px; }
.course-n{ margin:0; font-size:clamp(36px, 2.6vw, 56px); font-weight:300; line-height:1.12; letter-spacing:-.03em; }
.course-t{ margin:0; font-size:clamp(17px, 1.15vw, 22px); line-height:1.35; color:var(--ink); }
.course-s{ margin:0; font-size:14px; line-height:1.5; color:var(--ink-soft); }
.tests{ margin:0 0 26px; }
.frq-list{ list-style:none; margin:44px 0 0; padding:0; display:flex; flex-direction:column; gap:44px; max-width:760px; }
.frq-q{ display:grid; grid-template-columns:2em minmax(0, 1fr); column-gap:10px; outline-offset:8px; }
.frq-in{ display:block; width:100%; min-height:8.5em; margin:0; resize:vertical; font:inherit; font-size:clamp(17px, 1.05vw, 20px);
  line-height:1.5; color:var(--ink); background:var(--wall); border:0; border-radius:10px; padding:12px 14px; }
.frq-act{ display:flex; gap:12px; }
.frq-ans{ display:flex; flex-direction:column; gap:10px; }
.frq-ans p{ margin:0; font-size:17px; line-height:1.5; color:var(--ink); max-width:62ch; }
.frq-pts{ margin:0; padding:0 0 0 1.1em; display:flex; flex-direction:column; gap:6px; font-size:17px; line-height:1.5; color:var(--ink-soft); max-width:62ch; }
.frq-pts li::marker{ color:var(--muted); }
.frq-q mjx-container[display="true"]{ margin:.5em 0 !important; }
.mj-ring{ position:absolute; top:60px; left:clamp(48px, 5vw, 120px); }
html:not(.mj-wait) .mj-ring{ display:none; }
html.mj-wait .pane-r .body{ visibility:hidden; }

<section class="mcq" data-title="BIPN 103 Midterm 1, Test 1" data-nav="#nav-test-1"><script type="application/json">[{"q": "A cut that divides the body into front and back parts lies in which plane?", "options": ["A coronal plane", "A sagittal plane", "A transverse plane", "A parasagittal plane"], "answer": 0, "why": "A coronal plane runs from side to side and separates anterior (front) from posterior (back). A sagittal plane separates left from right, and the midsagittal one runs exactly down the middle. A transverse plane separates upper from lower parts. CT and MRI images are usually shown in all three planes."}, {"q": "In anatomical position, which bone of the forearm is lateral?", "options": ["The radius, on the thumb side", "The ulna, on the thumb side", "The radius, on the little-finger side", "The ulna, on the little-finger side"], "answer": 0, "why": "Anatomical position has the palms facing forward, so the thumb points away from the body's midline. The radius is on the thumb side, which is lateral. The ulna is on the little-finger side, which is medial. When the forearm pronates, the radius crosses over the ulna, but anatomical terms still refer to anatomical position."}, {"q": "Turning the palm to face backward from anatomical position is called:", "options": ["Pronation, done by pronator teres and pronator quadratus", "Supination, done by biceps brachii and the supinator", "Pronation, done by biceps brachii and the supinator", "Supination, done by pronator teres and pronator quadratus"], "answer": 0, "why": "Pronation turns the palm down (or back) as the radius rotates over the ulna. Pronator teres and pronator quadratus do it, and both are supplied by the median nerve. Supination turns the palm up or forward, done mainly by the supinator and by biceps brachii, which is a strong supinator when the elbow is bent."}, {"q": "Which joint type is the glenohumeral (shoulder) joint, and what is the trade-off of its design?", "options": ["A ball-and-socket synovial joint; very mobile but easily dislocated", "A hinge synovial joint; very stable but limited to one plane of motion", "A ball-and-socket synovial joint; very stable but limited in rotation", "A fibrous joint; very stable because ligaments fully lock the bones"], "answer": 0, "why": "The large humeral head sits in a shallow glenoid fossa, deepened only a little by the glenoid labrum. This allows movement in all planes, but the bones provide little stability, so it depends on the rotator cuff muscles and ligaments. It is the most commonly dislocated major joint, usually toward the front and bottom."}, {"q": "The shoulder dislocates toward the front and bottom much more often than toward the back. Why?", "options": ["The joint capsule and rotator cuff are weakest in front and below", "The joint capsule and rotator cuff are weakest behind and above", "The acromion blocks the humerus from moving forward or downward", "The coracoid process pushes the humerus toward the front and bottom"], "answer": 0, "why": "Above, the acromion, coracoid process and coracoacromial ligament form an arch, and the rotator cuff tendons cover the top, front and back of the joint. Below, the capsule is loose and has no muscle support. A fall on an outstretched, abducted and externally rotated arm drives the head forward and down, through this weak area."}, {"q": "Which rotator cuff muscle starts abduction of the arm for the first 15 degrees or so?", "options": ["Supraspinatus", "Infraspinatus", "Teres minor", "Subscapularis"], "answer": 0, "why": "Supraspinatus runs over the top of the joint and pulls the humeral head into the glenoid while starting abduction. The deltoid then takes over. Supraspinatus is the most commonly torn rotator cuff tendon, often from rubbing under the acromion. Infraspinatus and teres minor rotate the arm outward, and subscapularis rotates it inward."}, {"q": "A patient can raise her arm only to shoulder height. Which muscles are needed to lift the arm higher than 90 degrees?", "options": ["Trapezius and serratus anterior, rotating the scapula upward", "Rhomboids and levator scapulae, rotating the scapula downward", "Latissimus dorsi and teres major, pulling the humerus upward", "Pectoralis major and minor, pulling the scapula forward and down"], "answer": 0, "why": "Above about 90 degrees, the humerus alone cannot go higher. The scapula must rotate so the glenoid faces upward, which is done by the upper and lower trapezius and serratus anterior together. Rhomboids and levator scapulae rotate the scapula the other way. Latissimus dorsi and teres major pull the arm down."}, {"q": "After a mastectomy that removed lymph nodes along the side of the chest, a patient's scapula sticks out when she pushes against a wall. Which nerve was injured?", "options": ["The long thoracic nerve, supplying serratus anterior", "The dorsal scapular nerve, supplying the rhomboids", "The thoracodorsal nerve, supplying latissimus dorsi", "The accessory nerve, supplying the trapezius"], "answer": 0, "why": "The long thoracic nerve (from roots C5–C7) runs down the side of the chest wall on serratus anterior, where it can be damaged during lymph node removal. Serratus anterior holds the scapula against the ribs, so without it the medial border lifts away (winged scapula), especially when pushing. Accessory nerve injury causes a droopy shoulder and a different kind of winging."}, {"q": "Which part of the brachial plexus gives rise to the radial and axillary nerves?", "options": ["The posterior cord", "The lateral cord", "The medial cord", "The upper trunk alone"], "answer": 0, "why": "The posterior divisions of all three trunks join to form the posterior cord, which supplies the back of the arm and forearm. Its two big terminal branches are the axillary nerve (deltoid and teres minor) and the radial nerve (extensors). The lateral cord gives the musculocutaneous nerve, and the medial cord gives the ulnar nerve. The median nerve gets parts from both the lateral and medial cords."}, {"q": "A fracture of the humerus's surgical neck injures a nerve. Which deficits follow?", "options": ["Weak abduction and a numb patch over the lateral shoulder, from axillary nerve injury", "Wrist drop and a numb patch on the back of the hand, from radial nerve injury", "A claw hand and a numb little finger, from ulnar nerve injury at the elbow", "Weak elbow flexion and a numb lateral forearm, from musculocutaneous injury"], "answer": 0, "why": "The axillary nerve wraps around the surgical neck of the humerus with the posterior circumflex humeral artery. Injury weakens the deltoid (abduction beyond 15 degrees) and teres minor, and causes numbness over the lower deltoid (the \"regimental badge\" area). Over time the deltoid wastes and the shoulder looks flat."}, {"q": "A fracture of the humerus's midshaft injures a nerve. The patient cannot extend the wrist or fingers, but elbow extension is mostly normal. Which nerve, and why is the triceps spared?", "options": ["The radial nerve in the spiral groove, below its branches to the triceps", "The radial nerve in the axilla, above its branches to the triceps", "The ulnar nerve behind the elbow, below its branches to the triceps", "The median nerve in the arm, which never supplies the triceps at all"], "answer": 0, "why": "The radial nerve spirals around the back of the humerus in the radial (spiral) groove. Most of its branches to the triceps leave above this point, so elbow extension is largely spared. Below the groove, the nerve supplies the wrist and finger extensors, so wrist drop results. A crutch pressing on the axilla could injure the nerve higher up and weaken the triceps too."}, {"q": "A person hits their \"funny bone\" behind the medial epicondyle. Which hand area tingles?", "options": ["The little finger and the medial half of the ring finger", "The thumb, index finger and middle finger on the palm side", "The back of the hand near the base of the thumb", "The entire palm and every finger equally"], "answer": 0, "why": "The ulnar nerve passes behind the medial epicondyle in a groove where it is close to the skin, so a bump there irritates it. It supplies sensation to the little finger and the medial (little-finger) half of the ring finger. The median nerve covers the palm side of the thumb, index, middle and lateral half of the ring finger."}, {"q": "Long-term pressure on the ulnar nerve at the elbow causes a \"claw\" of the ring and little fingers. Why do these fingers claw?", "options": ["Their lumbricals and interossei are weak, so the extensors overpower them", "Their long flexors are paralyzed, so the fingers are pulled back by gravity", "Their extensors are paralyzed, so the flexors bend every joint fully", "Their skin is numb, so the patient holds them bent to avoid injury"], "answer": 0, "why": "The ulnar nerve supplies all the interossei and the two medial lumbricals. These muscles flex the knuckle joints and extend the finger joints. Without them in the ring and little fingers, the long extensors pull the knuckles into extension and the long flexors bend the finger joints, creating a claw. The index and middle fingers are spared because their lumbricals are supplied by the median nerve."}, {"q": "A woman with carpal tunnel syndrome has tingling in her thumb, index and middle fingers, but the skin over her thenar eminence feels normal. Why?", "options": ["The palmar cutaneous branch leaves the median nerve before the carpal tunnel", "The thenar skin is supplied by the radial nerve, which skips the tunnel", "The thenar skin is supplied by the ulnar nerve, which skips the tunnel", "The thenar skin has no nerve supply, so it never feels any tingling"], "answer": 0, "why": "The median nerve gives off its palmar cutaneous branch in the forearm, and this branch passes over (not through) the flexor retinaculum to supply the skin of the central palm and thenar area. So compression inside the tunnel spares that skin. Numbness of the palm itself would point to a problem higher up in the forearm."}, {"q": "Which muscle is weak in severe carpal tunnel syndrome, causing trouble touching the thumb to the little finger?", "options": ["Opponens pollicis, supplied by the recurrent branch of the median nerve", "Adductor pollicis, supplied by the deep branch of the ulnar nerve", "Flexor pollicis longus, supplied by the anterior interosseous nerve", "Abductor pollicis longus, supplied by the posterior interosseous nerve"], "answer": 0, "why": "After passing through the carpal tunnel, the median nerve sends a recurrent (motor) branch to the thenar muscles: opponens pollicis, abductor pollicis brevis and part of flexor pollicis brevis. Compression weakens opposition and causes thenar wasting. Adductor pollicis is supplied by the ulnar nerve, and the long forearm muscles are supplied above the tunnel."}, {"q": "A fall on an outstretched hand causes pain in the anatomical snuffbox. Which bone is most likely broken, and what is the main risk?", "options": ["The scaphoid, which can die because its blood enters from the far end", "The lunate, which can die because its blood enters from the near end", "The hamate, which can damage the ulnar artery running past its hook", "The trapezium, which can damage the median nerve running over it"], "answer": 0, "why": "The scaphoid is the most commonly broken carpal bone, and tenderness in the snuffbox suggests it. Branches of the radial artery enter mainly at its distal end, so a break across the middle can cut off blood to the proximal part, which may die (avascular necrosis). That is why snuffbox pain is treated as a fracture even if the first X-ray looks normal."}, {"q": "Which structure forms the floor of the anatomical snuffbox, and which artery runs through it?", "options": ["The scaphoid and trapezium; the radial artery", "The lunate and capitate; the ulnar artery", "The hamate and pisiform; the radial artery", "The scaphoid and trapezium; the ulnar artery"], "answer": 0, "why": "The snuffbox is the hollow on the back of the wrist at the base of the thumb, between the tendons of extensor pollicis longus (on one side) and extensor pollicis brevis and abductor pollicis longus (on the other). Its floor is made by the scaphoid and trapezium, and the radial artery crosses it on its way to the back of the hand."}, {"q": "A newborn delivered with strong pulling on the head has an arm that hangs with the shoulder turned inward and the forearm pronated (\"waiter's tip\"). Which roots were injured?", "options": ["Upper roots C5 and C6 (Erb–Duchenne palsy)", "Lower roots C8 and T1 (Klumpke palsy)", "The middle root C7, with no other roots hurt", "Every root from C5 through T1 together"], "answer": 0, "why": "Pulling the head away from the shoulder stretches the upper trunk (C5 and C6). This weakens the deltoid, supraspinatus, infraspinatus, biceps and brachialis, so the arm hangs at the side, rotated inward, with the elbow straight and the forearm pronated. Klumpke palsy (C8–T1) comes from pulling the arm upward and affects the hand."}, {"q": "A person grabs a branch while falling, pulling the arm hard upward. Afterward, the hand's small muscles are weak, and the eyelid on the same side droops with a small pupil. Which roots were injured?", "options": ["C8 and T1, including fibers that lead to the eye's sympathetic supply", "C5 and C6, including fibers that lead to the eye's sympathetic supply", "C8 and T1, including fibers of the facial nerve that close the eyelid", "C5 and C6, including fibers of the oculomotor nerve that lift the eyelid"], "answer": 0, "why": "Pulling the arm upward stretches the lower trunk (C8 and T1), which supplies the intrinsic hand muscles, causing a claw hand (Klumpke palsy). The T1 root also carries sympathetic fibers that leave the cord and rise to the eye. If the injury is close to the cord, these are damaged too, causing Horner syndrome: drooping eyelid, small pupil and less sweating on that side."}, {"q": "Which nerve supplies the main elbow flexors (biceps brachii and brachialis)?", "options": ["The musculocutaneous nerve (lateral cord)", "The radial nerve (posterior cord)", "The median nerve (lateral and medial cords)", "The axillary nerve (posterior cord)"], "answer": 0, "why": "The musculocutaneous nerve, from the lateral cord, pierces coracobrachialis and supplies the muscles of the front of the arm: coracobrachialis, biceps brachii and brachialis. It ends as the lateral cutaneous nerve of the forearm. Brachioradialis also flexes the elbow but is supplied by the radial nerve, which is why some elbow flexion remains after a musculocutaneous injury."}, {"q": "A child falls and breaks the humerus just above the elbow (supracondylar fracture). Which structures are most at risk?", "options": ["The brachial artery and median nerve in front of the elbow", "The axillary nerve and posterior circumflex humeral artery", "The radial nerve in the spiral groove on the back of the shaft", "The ulnar nerve and its artery in front of the medial epicondyle"], "answer": 0, "why": "In the cubital fossa, the brachial artery and median nerve lie just in front of the lower humerus. A displaced supracondylar fracture can tear or squeeze them. Blocked arterial flow can lead to Volkmann ischemic contracture, in which forearm muscles die and scar. Pulses and hand sensation are checked carefully after this injury."}, {"q": "Which feature is found only in cervical vertebrae?", "options": ["Transverse foramina that carry the vertebral arteries", "Facets on the bodies for the heads of the ribs", "Large, kidney-shaped bodies built for heavy loads", "Long spinous processes pointing sharply downward"], "answer": 0, "why": "Cervical vertebrae have foramina in their transverse processes (foramina transversaria). The vertebral arteries run up through those of C6 to C1 on their way to the brain. Rib facets mark thoracic vertebrae, which also have long, downward-pointing spinous processes. Large, heavy bodies mark lumbar vertebrae."}, {"q": "A disc between L4 and L5 herniates in the usual posterolateral direction. Which nerve root is most likely compressed?", "options": ["L5", "L4", "S1", "L3"], "answer": 0, "why": "Lumbar spinal nerves leave through the intervertebral foramen above the disc of the same number, high in the foramen. A posterolateral herniation of the L4–L5 disc misses the L4 nerve, which has already exited, and presses on the L5 root, which is passing down to exit below L5. This weakens big toe extension and causes numbness over the top of the foot."}, {"q": "Why is a lumbar puncture done between the L3 and L4 (or L4 and L5) vertebrae in adults?", "options": ["The spinal cord ends near L1–L2, so the needle meets only nerve roots below", "The spinal cord ends near L5, so the needle enters the cord's thickest part", "The dura ends near L3, so the needle reaches the spinal fluid most easily", "The vertebral arches are absent below L3, so there is no bone in the way"], "answer": 0, "why": "In adults the spinal cord ends at about the L1–L2 level (the conus medullaris), while the dural sac with its spinal fluid extends to about S2. Below L2, the sac holds only floating nerve roots (the cauda equina), which tend to move aside from the needle. A line between the tops of the iliac crests marks about the L4 level."}, {"q": "Which muscle group extends the spine, and which nerves supply it?", "options": ["Erector spinae, supplied by dorsal rami of spinal nerves", "Erector spinae, supplied by ventral rami of spinal nerves", "Latissimus dorsi, supplied by dorsal rami of spinal nerves", "Rhomboid muscles, supplied by ventral rami of spinal nerves"], "answer": 0, "why": "The deep (intrinsic) back muscles, such as the erector spinae columns (iliocostalis, longissimus and spinalis), developed in the back and are supplied by dorsal rami. The superficial back muscles, such as trapezius, latissimus dorsi and the rhomboids, moved to the back from the limb and are supplied by ventral rami (through the brachial plexus) or the accessory nerve."}, {"q": "Which joint between the first metacarpal and trapezium allows the thumb to oppose the other fingers?", "options": ["A saddle joint, moving in two planes and allowing opposition", "A hinge joint, moving in one plane and allowing flexion and extension", "A pivot joint, rotating around the long axis of the bone", "A plane joint, sliding in small amounts against its neighbor"], "answer": 0, "why": "The thumb's carpometacarpal joint has two curved surfaces that fit like a rider in a saddle. It allows flexion, extension, abduction and adduction, and combined with some rotation it produces opposition, letting the thumb pad meet the other finger pads. Arthritis at this joint is common and makes gripping painful."}, {"q": "Which muscle crosses both the shoulder and elbow and helps flex both?", "options": ["Biceps brachii, whose long head starts above the glenoid", "Brachialis, which starts on the lower front of the humerus", "Brachioradialis, which starts above the lateral epicondyle", "Coracobrachialis, which ends on the middle of the humerus"], "answer": 0, "why": "The long head of biceps brachii begins at the supraglenoid tubercle and runs through the shoulder joint, so the muscle helps flex the shoulder as well as the elbow and supinate the forearm. Brachialis and brachioradialis cross only the elbow, and coracobrachialis crosses only the shoulder."}, {"q": "Which spinal segment mainly supplies the skin of the middle finger?", "options": ["C7", "C5", "C6", "C8"], "answer": 0, "why": "Dermatomes of the hand run in order across the fingers: C6 covers the thumb and lateral hand, C7 the middle finger, and C8 the little finger and medial hand. A herniated disc pressing on the C7 root can cause numbness in the middle finger, along with a weak triceps reflex."}, {"q": "The cords of the brachial plexus are named lateral, medial and posterior. Relative to what?", "options": ["The second part of the axillary artery", "The first rib and the clavicle above it", "The humerus at its surgical neck", "The spinal cord at the C8 level"], "answer": 0, "why": "The three cords wrap around the axillary artery behind pectoralis minor, and each is named for its position next to the artery there. This close relationship explains why injuries to the artery in the axilla often damage the plexus too, and why surgeons use the artery as a landmark."}, {"q": "Holding a pen in the \"writing position\" bends the knuckle joints while keeping the finger joints straight. Which muscles do this?", "options": ["The lumbricals and interossei", "The long finger flexors alone", "The long finger extensors alone", "The thenar and hypothenar muscles"], "answer": 0, "why": "The lumbricals and interossei pass in front of the knuckle (MCP) joints, so they flex them, and then join the extensor expansion on the back of the fingers, so they extend the finger (IP) joints. No long forearm muscle can produce this combination by itself. Losing these small muscles produces a claw hand, the opposite posture."}]</script></section>
<script type="application/json" class="frq-data">[{"q": "A patient's right humerus is broken at mid-shaft. (a) Name the nerve most at risk and explain why. (b) Predict which movements the patient can and cannot make, and where sensation is lost. (c) Explain why elbow extension is mostly spared, and how the picture would differ if a badly fitted crutch had compressed the same nerve in the axilla instead.", "answer": "(a) The radial nerve runs in the radial (spiral) groove on the back of the humerus shaft, in direct contact with bone, so a mid-shaft fracture can stretch, cut or trap it. (b) The patient cannot extend the wrist (wrist drop) or extend the fingers at the knuckles, and the thumb cannot extend or abduct well, because all forearm extensors are supplied by the radial nerve below the groove. Grip is weak too, because the wrist cannot be held extended. Elbow flexion and forearm pronation work, though supination is weaker when the elbow is straight. Sensation is lost on the back of the hand over the first web space and nearby skin. (c) Most branches to the triceps leave the radial nerve in the axilla and upper arm, above the spiral groove, so elbow extension is largely spared. Compression in the axilla would affect the nerve above those branches, so the triceps would also be weak, along with everything below, and sensation on the back of the arm and forearm could be lost too.", "points": ["Radial nerve in the spiral groove, against the bone", "Wrist drop, no finger extension at the knuckles, numbness over the first web space", "Triceps spared because its branches leave above the groove", "Axillary compression also weakens the triceps"]}, {"q": "A worker who uses a keyboard for long hours has numbness of the thumb, index and middle fingers that wakes her at night. (a) Describe the boundaries of the carpal tunnel and list what passes through it. (b) Explain her symptoms and the motor problems that may follow, and explain why the skin over her thenar eminence still feels normal. (c) Explain why the ulnar nerve is not affected in carpal tunnel syndrome.", "answer": "(a) The carpal tunnel is formed by the carpal bones on the floor and sides and the flexor retinaculum as the roof, which attaches to the scaphoid and trapezium on one side and the pisiform and hamate on the other. It contains the median nerve and nine tendons: four of flexor digitorum superficialis, four of flexor digitorum profundus and flexor pollicis longus. (b) Swelling in the tight tunnel squeezes the median nerve, causing numbness and tingling in the thumb, index, middle and half of the ring finger on the palm side, often worse at night when the wrist is bent. Over time, the recurrent branch is affected, causing weakness and wasting of the thenar muscles, so opposition and thumb abduction get weak. The palmar cutaneous branch leaves the median nerve before the tunnel and runs over the flexor retinaculum, so the thenar skin keeps its feeling. (c) The ulnar nerve and artery pass through Guyon's canal, superficial to the flexor retinaculum, so they are not inside the carpal tunnel.", "points": ["Roof is the flexor retinaculum; contents are the median nerve and nine tendons", "Numbness in the lateral three and a half digits; thenar weakness later", "Palmar cutaneous branch spared because it runs over the retinaculum", "Ulnar nerve runs in Guyon's canal, outside the tunnel"]}]</script>
</section>

<section class="mcq" data-title="BIPN 103 Midterm 1, Test 2" data-nav="#nav-test-2"><script type="application/json">[{"q": "Which term describes a structure closer to the trunk along a limb?", "options": ["Proximal", "Distal", "Medial", "Superficial"], "answer": 0, "why": "Proximal means closer to where a limb attaches to the trunk, and distal means farther from it. The elbow is proximal to the wrist. Medial means closer to the midline of the body, and superficial means closer to the surface. These words always refer to anatomical position."}, {"q": "Shrugging your shoulders toward your ears is called:", "options": ["Elevation, by upper trapezius and levator scapulae", "Depression, by upper trapezius and levator scapulae", "Elevation, by serratus anterior and pectoralis minor", "Protraction, by upper trapezius and levator scapulae"], "answer": 0, "why": "Raising the scapula is elevation. The upper fibers of trapezius and levator scapulae do it. Depression lowers the scapula, and protraction moves it forward around the chest wall, as in punching, which is done by serratus anterior."}, {"q": "Which joint lets the radius rotate during pronation and supination?", "options": ["The proximal radioulnar joint, a pivot joint", "The humeroulnar joint, a hinge joint", "The radiocarpal joint, an ellipsoid joint", "The glenohumeral joint, a ball-and-socket joint"], "answer": 0, "why": "At the proximal radioulnar joint, the round head of the radius spins inside the annular ligament against the ulna's radial notch. Together with the distal radioulnar joint, this lets the radius swing around the ulna. The humeroulnar joint is a hinge that only flexes and extends. A toddler's radial head can slip out of the annular ligament when the arm is pulled (\"nursemaid's elbow\")."}, {"q": "Which rotator cuff muscle rotates the arm inward (medially)?", "options": ["Subscapularis", "Infraspinatus", "Teres minor", "Supraspinatus"], "answer": 0, "why": "Subscapularis lies on the front of the scapula and attaches to the lesser tubercle of the humerus, so it turns the arm inward. Infraspinatus and teres minor attach to the back of the greater tubercle and turn the arm outward. Supraspinatus starts abduction. All four together hold the humeral head in the glenoid."}, {"q": "A patient cannot begin to lift her arm sideways from her body, but once someone helps lift it past 20 degrees, she can raise it the rest of the way. Which muscle is affected?", "options": ["Supraspinatus", "Middle deltoid", "Upper trapezius", "Teres major"], "answer": 0, "why": "Supraspinatus starts abduction and holds the humeral head down and in, so the deltoid can lift effectively. When supraspinatus is torn, starting the movement fails, but once the arm is helped up a little, the deltoid can take over. A deltoid problem (as with axillary nerve damage) would cause the opposite pattern."}, {"q": "Which nerve supplies supraspinatus and infraspinatus, and where can it be compressed?", "options": ["The suprascapular nerve, at the suprascapular notch", "The axillary nerve, in the quadrangular space", "The subscapular nerves, on the front of the scapula", "The long thoracic nerve, on the side of the chest wall"], "answer": 0, "why": "The suprascapular nerve runs from the upper trunk, through the suprascapular notch under the transverse scapular ligament, to supply supraspinatus, and then around the spine of the scapula to infraspinatus. Compression at the notch weakens abduction and outward rotation. The suprascapular artery runs above the ligament instead."}, {"q": "Which pair correctly gives a brachial plexus cord and one of its terminal branches?", "options": ["Medial cord; ulnar nerve", "Lateral cord; ulnar nerve", "Posterior cord; median nerve", "Medial cord; radial nerve"], "answer": 0, "why": "The lateral cord gives the musculocutaneous nerve and part of the median nerve. The medial cord gives the ulnar nerve and the other part of the median nerve. The posterior cord gives the axillary and radial nerves. The two contributions to the median nerve form an \"M\" shape in front of the axillary artery, a common landmark in lab."}, {"q": "Which spinal roots form the lower trunk of the brachial plexus?", "options": ["C8 and T1", "C5 and C6", "C7 alone", "C6 and C7"], "answer": 0, "why": "The five roots C5 to T1 form three trunks: C5 and C6 join as the upper trunk, C7 continues alone as the middle trunk, and C8 and T1 join as the lower trunk. The lower trunk lies on the first rib behind the subclavian artery, where a cervical rib or a tumor at the top of the lung can compress it."}, {"q": "A patient cannot spread or squeeze together her fingers, but grip is mostly normal. Which nerve is injured, and where?", "options": ["The deep branch of the ulnar nerve in the hand, supplying the interossei", "The median nerve in the carpal tunnel, supplying the thenar muscles", "The radial nerve in the forearm, supplying the finger extensors", "The anterior interosseous nerve, supplying the deep forearm flexors"], "answer": 0, "why": "Spreading the fingers (abduction) uses the dorsal interossei, and squeezing them together (adduction) uses the palmar interossei. Both are supplied by the deep branch of the ulnar nerve. Grip comes mostly from the long finger flexors in the forearm, supplied mainly by the median nerve, so it can stay fairly strong."}, {"q": "The axillary nerve and posterior circumflex humeral artery pass through which space?", "options": ["The quadrangular space", "The triangular space", "The triangular interval", "The carpal tunnel"], "answer": 0, "why": "The quadrangular space is bordered by teres minor above, teres major below, the long head of triceps on the inside and the surgical neck of the humerus on the outside. The axillary nerve and posterior circumflex humeral artery pass through it. The triangular interval, lower down, carries the radial nerve and the deep brachial artery."}, {"q": "Which muscle is a powerful adductor and inward rotator of the arm, used in pull-ups, and is supplied by the thoracodorsal nerve?", "options": ["Latissimus dorsi", "Lower trapezius", "Teres minor", "Rhomboid major"], "answer": 0, "why": "Latissimus dorsi spans from the lower back and iliac crest to the floor of the intertubercular groove of the humerus. It extends, adducts and medially rotates the arm, powering pull-ups and swimming strokes. The thoracodorsal nerve, from the posterior cord, supplies it. Surgeons sometimes move this muscle to rebuild a breast or shoulder."}, {"q": "Which tendon runs in the intertubercular (bicipital) groove of the humerus?", "options": ["The long head of biceps brachii", "The short head of biceps brachii", "The long head of triceps brachii", "The tendon of the supraspinatus"], "answer": 0, "why": "The long head of biceps leaves the supraglenoid tubercle, passes through the shoulder joint and runs down the intertubercular groove, held there by the transverse humeral ligament. It can become inflamed or tear, causing a bulge in the arm (\"Popeye sign\"). The short head starts at the coracoid process."}, {"q": "An athlete falls onto the side of the shoulder and the acromion separates from the clavicle. Which joint is injured?", "options": ["The acromioclavicular joint", "The sternoclavicular joint", "The glenohumeral joint", "The scapulothoracic joint"], "answer": 0, "why": "A \"shoulder separation\" is an injury to the acromioclavicular (AC) joint and its ligaments, especially the coracoclavicular ligament. In severe cases, the clavicle rides up above the acromion. A shoulder dislocation, in contrast, involves the glenohumeral joint."}, {"q": "Which bone is the most commonly broken in the body, often from a fall onto the shoulder or outstretched hand?", "options": ["The clavicle, usually in its middle third", "The scapula, usually through its body", "The humerus, usually at its anatomical neck", "The radius, usually at its head"], "answer": 0, "why": "The clavicle acts as a strut connecting the arm to the trunk, and forces from a fall pass through it. It usually breaks at the junction of its middle and outer thirds, where it is thinnest and changes curve. The outer piece drops due to the weight of the arm, while sternocleidomastoid pulls the inner piece up."}, {"q": "A patient cannot flex the tip of the thumb or the tip of the index finger, so she cannot make an \"OK\" sign. Sensation is normal. Which nerve is injured?", "options": ["The anterior interosseous nerve, a motor branch of the median nerve", "The superficial radial nerve, a sensory branch of the radial nerve", "The recurrent branch of the median nerve, which supplies the thenar muscles", "The dorsal branch of the ulnar nerve, which supplies the back of the hand"], "answer": 0, "why": "The anterior interosseous nerve branches from the median nerve in the forearm and supplies flexor pollicis longus, the lateral half of flexor digitorum profundus (index and middle fingers) and pronator quadratus. It has no skin branches, so sensation is normal. Without these muscles, the tips of the thumb and index finger cannot bend, so they form a flat pinch instead of a circle."}, {"q": "Which muscle flexes the finger tips (the distal interphalangeal joints)?", "options": ["Flexor digitorum profundus", "Flexor digitorum superficialis", "The lumbrical muscles", "The palmar interossei"], "answer": 0, "why": "Flexor digitorum profundus sends tendons that pass through splits in the superficialis tendons to reach the distal phalanges, so it is the only muscle that bends the finger tips. Superficialis bends the middle joints. Its medial half (ring and little fingers) is supplied by the ulnar nerve and its lateral half by the median nerve."}, {"q": "A deep cut on the front of the wrist damages a nerve lying between the flexor carpi radialis and palmaris longus tendons. Which nerve?", "options": ["The median nerve, before the carpal tunnel", "The ulnar nerve, before Guyon's canal", "The superficial branch of the radial nerve", "The anterior interosseous nerve"], "answer": 0, "why": "At the wrist, the median nerve lies deep to or just lateral to palmaris longus, between it and flexor carpi radialis, before entering the carpal tunnel. The ulnar nerve and artery lie near flexor carpi ulnaris on the medial side. Wrist cuts are common in accidents and self-harm, and testing thumb opposition and finger sensation checks the median nerve."}, {"q": "An infant has extra weakness of shoulder abduction, outward rotation and elbow flexion after a hard delivery. Which part of the brachial plexus is damaged?", "options": ["The upper trunk, from roots C5 and C6", "The lower trunk, from roots C8 and T1", "The medial cord, from roots C8 and T1", "The posterior cord, from roots C5 to T1"], "answer": 0, "why": "The upper trunk supplies the suprascapular nerve (supraspinatus and infraspinatus), the musculocutaneous nerve (biceps and brachialis) and part of the axillary nerve (deltoid). Damaging it weakens abduction, outward rotation and elbow flexion, giving the \"waiter's tip\" position of Erb palsy. Hand muscles, supplied mostly by C8 and T1, are spared."}, {"q": "Which type of cartilage covers the joint surfaces of synovial joints?", "options": ["Hyaline cartilage, smooth and without blood vessels", "Fibrocartilage, tough and full of blood vessels", "Elastic cartilage, bendy and full of elastic fibers", "Hyaline cartilage, rough and full of blood vessels"], "answer": 0, "why": "Articular cartilage is hyaline cartilage, which gives a smooth, low-friction surface. It has no blood vessels, so it gets nutrients from synovial fluid, and it heals poorly after injury, which is why osteoarthritis tends to worsen. Fibrocartilage forms structures like intervertebral discs and the knee menisci."}, {"q": "What makes the thoracic region of the spine relatively stiff compared with the cervical and lumbar regions?", "options": ["The ribs attach to the vertebrae and sternum, forming a rigid cage", "The thoracic discs are thicker than the discs in the neck and low back", "The thoracic vertebrae have no facet joints between them at all", "The spinal cord is thickest in the chest, limiting movement there"], "answer": 0, "why": "Each thoracic vertebra connects to ribs at its body and transverse processes, and most ribs connect to the sternum in front. This cage limits bending and twisting. Thoracic discs are also relatively thin, and the long, overlapping spinous processes limit extension. The neck and low back, without ribs, move much more."}, {"q": "In the lumbar spine, the facet joints face mostly toward each other (medially and laterally). Which movement do they limit the most?", "options": ["Twisting (rotation)", "Bending forward", "Bending backward", "Bending sideways"], "answer": 0, "why": "Lumbar facet joints lie mostly in a sagittal plane, so their surfaces block twisting while allowing forward and backward bending. Thoracic facets lie in a coronal plane, which allows rotation, and cervical facets are tilted, allowing movement in all directions. This is why most trunk twisting happens in the thoracic spine."}, {"q": "Which ligament runs down the back of the vertebral bodies, inside the vertebral canal, and helps steer disc herniations to the side?", "options": ["The posterior longitudinal ligament", "The anterior longitudinal ligament", "The ligamentum flavum of the arches", "The interspinous ligament of the spine"], "answer": 0, "why": "The posterior longitudinal ligament lies on the back of the vertebral bodies and discs, in front of the spinal cord. It is narrow, especially in the lumbar region, and strongest in the middle, so herniating disc material is pushed to the side (posterolaterally), where it presses on nerve roots. The ligamentum flavum joins the laminae behind the cord."}, {"q": "An intervertebral disc herniates. Which part of the disc pushes out?", "options": ["The jelly-like nucleus pulposus, through a tear in the annulus fibrosus", "The ring-like annulus fibrosus, through a tear in the nucleus pulposus", "The bony end plate, through a crack in the body of the vertebra", "The ligamentum flavum, through a gap between two vertebral arches"], "answer": 0, "why": "A disc has a soft center, the nucleus pulposus, surrounded by tough rings of fibrocartilage, the annulus fibrosus. With age and heavy loads, the annulus can crack, and the nucleus squeezes out, usually backward and to the side where the annulus is thinnest. The bulge presses on nearby nerve roots, causing pain and weakness along their paths."}, {"q": "A stab wound injures the accessory nerve (cranial nerve XI) in the posterior triangle of the neck. Which problem results?", "options": ["Trouble shrugging and raising the arm overhead, from a weak trapezius", "Trouble turning the head away, from a weak sternocleidomastoid alone", "Trouble pushing forward, from a weak serratus anterior and pectoralis", "Trouble pulling down, from a weak latissimus dorsi and teres major"], "answer": 0, "why": "The accessory nerve crosses the posterior triangle superficially, after supplying sternocleidomastoid, so injuries there usually spare that muscle but paralyze trapezius. The shoulder droops, shrugging is weak, and lifting the arm above shoulder height is hard because the scapula cannot rotate upward properly."}, {"q": "Which artery continues from the axillary artery after it passes the lower border of teres major?", "options": ["The brachial artery", "The radial artery", "The subclavian artery", "The ulnar artery"], "answer": 0, "why": "The subclavian artery becomes the axillary artery at the outer border of the first rib, and the axillary artery becomes the brachial artery at the lower border of teres major. The brachial artery then divides into the radial and ulnar arteries in the cubital fossa. Blood pressure is usually measured over the brachial artery."}, {"q": "A tight band (tourniquet) blocks the axillary artery between its subscapular branch and the brachial artery. <script>
/* minimono.js — the house style's behavior. Include before </body>; no init.
   1. Two panes or one. Full-screen shows both (left ¼ · right ¾). The page
      goes to one pane when the window isn't full-screen, or when the person
      hides the left pane (`, or the pane's own "Hide"). Hiding is
      remembered. Force the layout with <html data-layout="split|single">.
   2. In one-pane mode the "Menu" link (.menu-hint) is invisible until the
      pointer enters the top-left zone (left quarter, top sixth); clicking it,
      or `, opens the left pane as an overlay. Esc, a click outside, or
      choosing a row closes it. With no pointer (touch), the link stays shown.
      The overlay is the SAME .pane-l element, moved by a class — never a
      copy, never rebuilt — so its scroll position and selection survive.
   3. Safari: trackpad pinch-zoom is blocked; ⌘+ / ⌘− still work.          */
(function () {
  'use strict';
  var html = document.documentElement;
  var KEY = 'minimono:pane-hidden';
  var hidden = false;
  try { hidden = localStorage.getItem(KEY) === '1'; } catch (e) {}

  /* 1. Two panes or one ---------------------------------------------------- */
  function isFull() {
    var forced = html.getAttribute('data-layout');
    if (forced === 'split') return true;
    if (forced === 'single') return false;
    // Full-screen or maximized. At the top level, measure the window itself
    // (outerWidth): ⌘+ zoom shrinks innerWidth but not the window. Embedded
    // in a frame, the frame's own width is what's available.
    var top = true;
    try { top = window.top === window; } catch (e) { top = false; }

  function layout() {
    var windowed = !isFull();
    html.classList.toggle('is-windowed', windowed);
    var single = windowed || hidden;
    if (single !== html.classList.contains('is-single')) {
      if (!single) close(true);
      html.classList.toggle('is-single', single);
    }
  }
  function setHidden(v) {
    hidden = v;
    try { localStorage.setItem(KEY, v ? '1' : '0'); } catch (e) {}
    close(true);
    layout();
  }
  var raf = 0;
  addEventListener('resize', function () { if (!raf) raf = requestAnimationFrame(function () { raf = 0; layout(); }); });
  new MutationObserver(layout).observe(html, { attributes: true, attributeFilter: ['data-layout'] });

  /* 2. The overlay --------------------------------------------------------- */
  var lastFocus = null;
  function pane() { return document.querySelector('.pane-l'); }
  function typing(el) {
    if (!el || el === document.body) return false;
    if (el.isContentEditable) return true;
    if (el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') return true;
    return el.tagName === 'INPUT' && !/^(button|submit|reset|checkbox|radio|range|color|file|image)$/i.test(el.type);
  }
  function single() { return html.classList.contains('is-single'); }
  function isOpen() { return html.classList.contains('menu-open'); }
  function open(keyboard) {
    if (!single() || isOpen()) return;
    html.classList.remove('hint-on');
    html.classList.add('menu-open');
    lastFocus = document.activeElement;
    if (keyboard) {                                   // keyboard: move focus in

    html.classList.remove('menu-open');

    if (!silent && lastFocus && lastFocus.focus && lastFocus !== document.body) lastFocus.focus({ preventScroll: true });
    else if (p && p.contains(document.activeElement)) document.activeElement.blur();

  }

  // Entering it shows the menu link; nothing opens until the link is clicked.
  function inZone(x, y) { return x <= innerWidth / 4 && y <= innerHeight / 6; }

  addEventListener('keydown', function (e) {

    if (t.closest('.menu-hint')) { e.preventDefault(); isOpen() ? close() : open(false); return; }

  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
  });

  layout();
  window.Minimono = {
    open: function () { open(true); }, close: close,
    hide: function () { setHidden(true); }, show: function () { setHidden(false); },
    relayout: layout
  };
})();

   at load; answering only changes classes and text.

       <script type="application/json">[
         { "q": "If \\(t = \\sqrt{\\dfrac{2h}{g}}\\), how much taller must the table be to double \\(t\\)?",
           "options": ["\\(2\\times\\)", "\\(4\\times\\)", "\\(8\\times\\)"],
           "answer": 1,                       (0-based index into options, or a letter)
           "why": "\\(t \\propto \\sqrt{h}\\), so doubling \\(t\\) takes \\(4h\\)." }
       ]<\/script>                         (written <\/script here so the file can be inlined)

   and the letters you talk about stay put), and reshuffled on Start over.

   strikes a wrong pick, shows the why, and locks the question. A keyboard
   answer glides on to the next unanswered question.

   options, your answer or Skipped, and the right answer. Math stays LaTeX

      fb.setAttribute('aria-live', 'polite');

      li.append(num, body);

      var q = { quiz: quiz, i: i, d: d, li: li, num: num.appendChild(document.createTextNode('')), opts: opts, btns: btns,

  };

  function copy(btn, text, fallback) {
    var label = btn.firstChild, was = label.nodeValue;
    function done() { fallback.hidden = true; label.nodeValue = 'Copied'; setTimeout(function () { label.nodeValue = was; }, 1400); }
    function fail() { fallback.value = text; fallback.hidden = false; fallback.focus(); fallback.select(); }
    try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
  }

  tests.forEach(function (t) {
    var root = t.querySelector('.mcq');
    var nav = document.querySelector(root.getAttribute('data-nav'));
    navs[t.id] = nav;
    var data = JSON.parse(t.querySelector('script.frq-data').textContent);
    var n0 = JSON.parse(root.querySelector('script[type="application/json"]').textContent).length;
    var key = 'bipn:frq:' + t.getAttribute('data-key');
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) {}
    if (!saved || !Array.isArray(saved.text)) saved = { text: [], open: [] };

    var list = make('ol', 'frq-list');
    var items = data.map(function (d, i) {
      var n = n0 + i + 1;
      var li = make('li', 'frq-q');
      li.id = t.id + '-frq-' + (i + 1);
      li.tabIndex = -1;
      var num = make('span', 'mcq-n', String(n));
      num.setAttribute('aria-hidden', 'true');
      var body = make('div', 'mcq-body');
      var text = make('div', 'mcq-text', glue(d.q));
      var box = make('textarea', 'frq-in');
      box.id = li.id + '-in';
      box.rows = 6;
      box.spellcheck = false;
      box.setAttribute('aria-label', 'Your answer to question ' + n);
      box.value = saved.text[i] || '';
      var act = make('div', 'frq-act');
      var btn = make('button', 'btn frq-show');
      btn.type = 'button';
      var label = btn.appendChild(document.createTextNode('Show answer'));
      act.append(btn);
      var ans = make('div', 'frq-ans');
      ans.append(make('p', null, glue(d.answer)));
      if (d.points && d.points.length) {
        var ul = make('ul', 'frq-pts');
        d.points.forEach(function (p) { ul.append(make('li', null, glue(p))); });
        ans.append(ul);
      }
      body.append(text, box, act, ans);
      li.append(num, body);
      list.append(li);
      var it = { d: d, n: n, li: li, box: box, ans: ans, navA: null };
      it.open = function (v) {
        ans.hidden = !v;
        label.nodeValue = v ? 'Hide answer' : 'Show answer';
        btn.setAttribute('aria-expanded', v ? 'true' : 'false');
      };
      it.open(!!saved.open[i]);
      btn.addEventListener('click', function () { it.open(ans.hidden); save(); });
      box.addEventListener('input', save);
      if (nav) {
        var a = make('a', 'mcq-nav-n', String(n));
        a.href = '#' + li.id;
        a.addEventListener('click', function (e) { e.preventDefault(); glide(li); li.focus({ preventScroll: true }); });
        it.navA = a;
      }
      return it;
    });
    function save() {
      try {
        localStorage.setItem(key, JSON.stringify({
          text: items.map(function (x) { return x.box.value; }),
          open: items.map(function (x) { return !x.ans.hidden; })
        }));
      } catch (e) {}
    }
    function navTail() { if (nav) items.forEach(function (x) { nav.append(x.navA); }); }

    var bar = root.querySelector('.mcq-bar');
    var fallback = root.querySelector('.mcq-fallback');
    var reset = root.querySelector('.mcq-reset');
    root.insertBefore(list, bar);
    navTail();

    var copyW = make('button', 'btn frq-copy');
    copyW.type = 'button';
    copyW.appendChild(document.createTextNode('Copy written answers'));
    bar.insertBefore(copyW, reset);
    copyW.addEventListener('click', function () {
      var lines = [root.getAttribute('data-title') + ', written answers', ''];
      items.forEach(function (x) {
        lines.push(x.n + '. ' + asPlain(x.d.q));
        lines.push('   Your answer: ' + (x.box.value.trim() || 'Skipped'));
        lines.push('   Model answer: ' + asPlain(x.d.answer));
        (x.d.points || []).forEach(function (p) { lines.push('   - ' + asPlain(p)); });
        lines.push('');
      });
      copy(copyW, lines.join('\n'), fallback);
    });
    reset.addEventListener('click', function () {   // quiz.js reshuffles first; then clear the written answers
      items.forEach(function (x) { x.box.value = ''; x.open(false); });
      save();
      navTail();
    });
  });

  // the two tests already exist; switching only flips `hidden` and aria-current
  function show(id) {
    if (!/^test-\d+$/.test(id) || !document.getElementById(id)) id = tests[0].id;
    if (cur === id) return;
    if (cur) mem[cur] = pane.scrollTop;
    tests.forEach(function (t) { t.hidden = t.id !== id; });
    rows.forEach(function (r) { r.setAttribute('aria-current', r.getAttribute('data-test') === id ? 'true' : 'false'); });
    Object.keys(navs).forEach(function (k) { if (navs[k]) navs[k].hidden = k !== id; });
    cur = id;
    pane.scrollTop = mem[id] || 0;
  }
  function fromHash() { show((location.hash || '').slice(1)); }
  addEventListener('hashchange', fromHash);
  fromHash();

  // the questions wait behind the loading ring until MathJax has drawn them
  window.__mathReady = function () { html.classList.remove('mj-wait'); };
  setTimeout(window.__mathReady, 9000);
})();

</script>
</body>
