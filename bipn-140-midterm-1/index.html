  // controls that use arrows / Page / Home / End themselves keep them
  function ownsKeys(el) {
    if (!el || el === document.body) return false;
    if (el.isContentEditable) return true;
    var t = el.tagName;
    if (t === 'TEXTAREA' || t === 'SELECT') return true;
    if (t === 'INPUT') return !/^(button|submit|reset|checkbox|color|file|image)$/i.test(el.type);
    var r = el.getAttribute && el.getAttribute('role');
    return !!r && /^(slider|spinbutton|radio|radiogroup|tab|tablist|listbox|option|menu|menubar|menuitem|combobox|grid|tree|treeitem|textbox)$/.test(r);
  }
  function spaceActivates(el) {
    if (!el || el === document.body) return false;
    if (/^(BUTTON|A|SUMMARY|INPUT)$/.test(el.tagName)) return true;
    var r = el.getAttribute && el.getAttribute('role');
    return !!r && /^(button|link|tab|checkbox|radio|switch|menuitem|option|slider)$/.test(r);
  }

  /* One animator per scroller ------------------------------------------- */
  var anims = new WeakMap();
  function Anim(el) {
    this.el = el; this.pos = el.scrollTop; this.vel = 0;
    this.held = null; this.ideal = this.pos; this.minTravel = this.pos;
    this.raf = 0; this.last = 0;
  }
  Anim.prototype.max = function () { return this.el.scrollHeight - this.el.clientHeight; };
  Anim.prototype.sync = function () {
    // the user may have scrolled by wheel/trackpad since we last moved it
    if (!this.raf) { this.pos = this.el.scrollTop; this.ideal = this.pos; this.vel = 0; }
  };
  Anim.prototype.run = function () {
    if (this.raf) return;
    var self = this; this.last = performance.now();
    this.raf = requestAnimationFrame(function f(t) { self.step(t) ? (self.raf = requestAnimationFrame(f)) : (self.raf = 0); });
  };
  Anim.prototype.stop = function () { if (this.raf) cancelAnimationFrame(this.raf); this.raf = 0; this.vel = 0; this.held = null; };
  Anim.prototype.write = function () {
    var max = this.max();
    if (this.pos <= 0 || this.pos >= max) {          // hit an edge: stop there, no overshoot
      this.pos = Math.min(Math.max(this.pos, 0), max);
      this.vel = 0; this.ideal = this.pos;
      this.el.scrollTop = this.pos;
      return false;
    }
    this.el.scrollTop = this.pos;
    return true;
  };
  /* ScrollAnimationKeyboard::animateScroll */
  Anim.prototype.step = function (t) {
    var dt = (t - this.last) / 1000; this.last = t;
    if (dt <= 0) return true;
    if (dt > 0.05) dt = 0.05;                          // a stalled frame shouldn't fling
    var force = 0, spring = true, ideal = this.ideal;
    if (this.held) {
      force = this.held.force; spring = false; ideal = this.pos;
      if (Math.abs(this.vel) >= Math.abs(this.held.maxVel)) force = 0;
    }
    var disp = this.pos - ideal;
    if (spring) force -= disp * STIFF + this.vel * DAMP;
    this.vel += force / MASS * dt;
    this.pos += this.vel * dt;
    var inside = this.write();
    if (spring && disp * (this.pos - ideal) < 0) { this.vel = 0; this.pos = ideal; this.el.scrollTop = ideal; }
    if (!inside && !this.held) return false;
    if (!this.held && this.vel * this.vel < 1 && Math.abs(this.pos - ideal) < 0.5) { this.vel = 0; return false; }
    return true;
  };
  /* startKeyboardScroll — velocity carries over, like WebKit */
  Anim.prototype.hold = function (dir, step) {
    var maxVel = step * MAX_VEL_MULT * dir;
    this.held = { dir: dir, maxVel: maxVel, force: maxVel * MASS / TIME_TO_MAX };
    this.minTravel = this.pos + step * dir;
    this.run();
  };
  /* stopKeyboardScrollAnimation */
  Anim.prototype.release = function () {
    if (!this.held) return;
    var d = Math.sqrt(this.vel * this.vel * MASS / STIFF) * (this.vel < 0 ? -1 : 1);
    var settle = this.pos + d;
    this.ideal = this.held.dir > 0 ? Math.max(settle, this.minTravel) : Math.min(settle, this.minTravel);
    this.ideal = Math.round(Math.min(Math.max(this.ideal, 0), this.max()));
    this.held = null;
    this.run();
  };
  /* a jump to a target (top / bottom, or the public API): spring there */
  Anim.prototype.to = function (target) {
    var base = this.raf && !this.held ? this.ideal : this.pos;
    if (typeof target === 'function') target = target(base);
    this.held = null;
    this.ideal = Math.round(Math.min(Math.max(target, 0), this.max()));
    this.run();
  };

  function anim(el) { var a = anims.get(el); if (!a) { a = new Anim(el); anims.set(el, a); } a.sync(); return a; }
  function pageStep(el) {
    var h = el === docEl() ? innerHeight : el.clientHeight;
    return Math.max(h * PAGE_MIN_FRACTION, h - PAGE_OVERLAP);
  }

  var heldKey = null, heldAnim = null;
  function releaseHeld() { if (heldAnim) heldAnim.release(); heldKey = heldAnim = null; }

  addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.altKey || e.ctrlKey) return;
    var k = e.key, cmdArrow = e.metaKey && (k === 'ArrowUp' || k === 'ArrowDown');
    if (e.metaKey && !cmdArrow) return;
    if (!/^( |ArrowUp|ArrowDown|PageUp|PageDown|Home|End)$/.test(k)) return;
    var act = document.activeElement;
    if (ownsKeys(act)) return;
    if (k === ' ' && spaceActivates(act)) return;
    if ((k === 'ArrowUp' || k === 'ArrowDown') && e.shiftKey && !cmdArrow) return;   // leave selection alone

    var el = pickScroller(); if (!el) return;
    e.preventDefault();
    var edge = cmdArrow || k === 'Home' || k === 'End';
    if (!edge && (e.repeat || heldKey)) return;                // WebKit ignores repeats and other keys while one is held
    var a = anim(el), page = pageStep(el);

    if (reduce && reduce.matches) {                       // same steps, no animation
      a.stop();
      var dy = k === 'ArrowDown' ? LINE : k === 'ArrowUp' ? -LINE :
               (k === ' ' && !e.shiftKey) || k === 'PageDown' ? page : page * -1;
      if (k === 'Home' || (cmdArrow && k === 'ArrowUp')) el.scrollTop = 0;
      else if (k === 'End' || (cmdArrow && k === 'ArrowDown')) el.scrollTop = el.scrollHeight;
      else el.scrollTop += dy;
      return;
    }

    if (edge) {
      a.to(k === 'Home' || k === 'ArrowUp' ? 0 : a.max());
    } else if (k === 'ArrowUp' || k === 'ArrowDown') {
      heldKey = k; heldAnim = a; a.hold(k === 'ArrowDown' ? 1 : -1, LINE);
    } else {
      heldKey = k; heldAnim = a;
      a.hold((k === ' ' && !e.shiftKey) || k === 'PageDown' ? 1 : -1, page);
    }
  });
  addEventListener('keyup', function (e) { if (e.key === heldKey) releaseHeld(); });
  addEventListener('blur', releaseHeld);
  document.addEventListener('visibilitychange', function () { if (document.hidden) releaseHeld(); });
  /* a wheel/trackpad scroll takes over from a gliding key scroll */
  addEventListener('wheel', function (e) {
    var el = scrollerFrom(e.target), a = el && anims.get(el);
    if (a && a.raf && !a.held) a.stop();
  }, { passive: true });

  window.SmoothScroll = {
    /* programmatic glide, e.g. SmoothScroll.to(pane, 0) to send a pane home */
    to: function (el, y) { anim(el || docEl()).to(y); },
    by: function (el, dy) { var a = anim(el || docEl()); a.to(function (b) { return b + dy; }); }
  };
})();

</script>
<script>
/* quiz.js — multiple-choice questions, the house way. Include before </body>; no init.

   Write each quiz as JSON inside a .mcq element. The page builds it once,
   at load; answering only changes classes and text.

     <section class="mcq" data-title="Chapter 5 practice">
       <script type="application/json">[
         { "q": "If \\(t = \\sqrt{\\dfrac{2h}{g}}\\), how much taller must the table be to double \\(t\\)?",
           "options": ["\\(2\\times\\)", "\\(4\\times\\)", "\\(8\\times\\)"],
           "answer": 1,                       (0-based index into options, or a letter)
           "why": "\\(t \\propto \\sqrt{h}\\), so doubling \\(t\\) takes \\(4h\\)." }
       ]<\/script>                         (written <\/script here so the file can be inlined)
     </section>

   Randomized, always: the question order and each question's options are
   shuffled the first time the quiz opens, kept through reloads (so progress
   and the letters you talk about stay put), and reshuffled on Start over.
   Never refer to a letter or a position in a question, option or why.

   Optional: an empty <nav class="mcq-nav"></nav> (the left pane of a quiz
   page) becomes the question numbers: plain = unanswered, underlined =
   right, struck through = wrong. Clicking one glides to that question.

   Answer with a click, or press A–F or 1–6. Keys go to the question that
   holds focus or sits under the pointer, else the first unanswered one on
   screen. An answer shows Correct / Incorrect, marks the right option,
   strikes a wrong pick, shows the why, and locks the question. A keyboard
   answer glides on to the next unanswered question.

   Copy answers is always there: plain text with each question, its
   options, your answer or Skipped, and the right answer. Math stays LaTeX
   ($…$) so it pastes cleanly into a chat.

   MCQ.audit() lists anything that gives an answer away: the right option
   longest or shortest, options of very different length, a hedge only on
   the right one or an absolute only on the wrong ones, "all/none of the
   above", duplicates, a missing why, a slash fraction. It must come back
   empty before a quiz is published; the same list goes to the console.     */
(function () {
  'use strict';
  if (window.MCQ) return;
  var LETTERS = 'ABCDEF';
  var quizzes = [];
  var hoverQ = null;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)');

  /* ── helpers ──────────────────────────────────────────────────────────── */
  function make(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  // punctuation right after inline math moves inside it, so a line can't start with ", "
  function glue(s) { return String(s).replace(/\\\)([.,;:!?])/g, '$1\\)'); }
  function asPlain(s) { return String(s).replace(/\\\(|\\\)/g, '$').replace(/\\\[|\\\]/g, '$$$$'); }
  function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
  function newSeed() {
    try { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0]; }
    catch (e) { return (Math.random() * 4294967296) >>> 0; }
  }
  function rng(seed) {                                 // mulberry32: small, seedable, even
    return function () {
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffled(n, rand) {                         // Fisher–Yates
    var a = []; for (var i = 0; i < n; i++) a.push(i);
    for (var j = n - 1; j > 0; j--) { var k = Math.floor(rand() * (j + 1)), t = a[j]; a[j] = a[k]; a[k] = t; }
    return a;
  }
  function answerIndex(answer, n) {
    if (typeof answer === 'number') return answer >= 0 && answer < n ? answer : 0;
    var j = LETTERS.indexOf(String(answer).trim().toUpperCase());
    return j >= 0 && j < n ? j : 0;
  }
  function scrollerOf(node) {
    for (var e = node.parentElement; e && e !== document.body; e = e.parentElement) {
      var o = getComputedStyle(e).overflowY;
      if ((o === 'auto' || o === 'scroll') && e.scrollHeight > e.clientHeight) return e;
    }
    return document.scrollingElement || document.documentElement;
  }
  function glideTo(node) {
    var sc = scrollerOf(node), page = sc === (document.scrollingElement || document.documentElement);
    var top = node.getBoundingClientRect().top - (page ? 0 : sc.getBoundingClientRect().top);
    var y = Math.max(0, sc.scrollTop + top - sc.clientHeight * 0.18);
    if (reduce && reduce.matches) sc.scrollTop = y;
    else if (window.SmoothScroll) SmoothScroll.to(sc, y);
    else sc.scrollTo({ top: y, behavior: 'smooth' });
  }
  function shown(q) { return q.li.offsetParent !== null; }
  function onScreen(q) { var r = q.li.getBoundingClientRect(); return r.bottom > 40 && r.top < innerHeight - 40; }
  function copyText(btn, text, fallback) {
    var label = btn.firstChild, was = label.nodeValue;
    function done() { fallback.hidden = true; label.nodeValue = 'Copied'; setTimeout(function () { label.nodeValue = was; }, 1400); }
    function fail() { fallback.value = text; fallback.hidden = false; fallback.focus(); fallback.select(); }
    try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
  }

  /* ── the giveaway check ───────────────────────────────────────────────── */
  var HEDGE = /\b(usually|often|generally|typically|mostly|may|might|can|sometimes|tends? to|about|roughly)\b/i;
  var ABSOLUTE = /\b(always|never|only|all|none|every|completely|entirely|impossible|guaranteed)\b/i;
  function words(s) {                                  // what a reader sees: LaTeX commands and delimiters out
    return String(s).replace(/\\[a-zA-Z]+/g, ' ').replace(/[\\{}()\[\]^_$]/g, '').replace(/\s+/g, ' ').trim();
  }
  function auditOne(d, i) {
    var out = [], n = (d.options || []).length, ans = answerIndex(d.answer, n);
    var say = function (msg) { out.push({ question: i + 1, text: words(d.q).slice(0, 60), issue: msg }); };
    if (n < 3) say('fewer than 3 options');
    if (!d.why) say('no why');
    var opts = (d.options || []).map(words), lens = opts.map(function (o) { return o.length; });
    if (new Set((d.options || []).map(function (o) { return String(o).replace(/\s+/g, ' ').trim().toLowerCase(); })).size < n) say('two options are the same');
    if (opts.some(function (o) { return /\b(all|none|both|neither) of (the|these) (above|options)\b/i.test(o); })) say('"all / none / both of the above"');
    var max = Math.max.apply(null, lens), min = Math.min.apply(null, lens);
    if (max > 12) {                                    // short answers (numbers, symbols) can't give much away by length
      if (max / Math.max(min, 1) > 1.5) say('options differ a lot in length (' + min + '–' + max + ' characters)');
      var others = lens.filter(function (_, j) { return j !== ans; });
      var nextLong = Math.max.apply(null, others), nextShort = Math.min.apply(null, others);
      if (lens[ans] > nextLong && lens[ans] >= nextLong * 1.15) say('the right answer is the longest option');
      if (lens[ans] < nextShort && lens[ans] <= nextShort * 0.85) say('the right answer is the shortest option');
    }
    var wrong = opts.filter(function (_, j) { return j !== ans; });
    if (HEDGE.test(opts[ans]) && !wrong.some(function (o) { return HEDGE.test(o); })) say('only the right answer hedges ("usually", "can"…)');
    if (!ABSOLUTE.test(opts[ans]) && wrong.length && wrong.every(function (o) { return ABSOLUTE.test(o); })) say('only the wrong answers use absolutes ("always", "never"…)');
    [d.q, d.why].concat(d.options || []).forEach(function (s) {
      (String(s || '').match(/\\\(([\s\S]*?)\\\)|\\\[([\s\S]*?)\\\]/g) || []).forEach(function (m) {
        if (m.indexOf('/') !== -1) say('slash fraction in math: ' + m.slice(0, 30));
      });
      if (/\b(?:[Oo]ption|[Aa]nswer(?: is)?|[Cc]hoice|[Ll]etter) [A-F]\b/.test(words(s))) say('refers to a letter, but options are shuffled');
    });
    return out;
  }

  /* ── one quiz ─────────────────────────────────────────────────────────── */
  function build(root) {
    var src = root.querySelector('script[type="application/json"]'), data;
    try { data = JSON.parse(src.textContent); } catch (e) { return; }
    if (!Array.isArray(data) || !data.length) return;
    var title = root.getAttribute('data-title') || document.title;
    var key = 'minimono:mcq2:' + hash(data.map(function (d) { return d.q + '\u0001' + (d.options || []).join('\u0001'); }).join('\n'));
    var state = null;
    try { state = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) {}
    if (!state || typeof state.seed !== 'number' || !Array.isArray(state.answers)) state = { seed: newSeed(), answers: [] };

    var quiz = { root: root, data: data, qs: [], order: [], nav: null };
    var list = make('ol', 'mcq-list');
    var nav = document.querySelector(root.getAttribute('data-nav') || '.mcq-nav');  // one nav per test
    if (nav && !nav.dataset.built) { nav.dataset.built = '1'; quiz.nav = nav; }
    var base = quizzes.reduce(function (s, z) { return s + z.qs.length; }, 0);

    // every element is made once, here; shuffling only moves them
    data.forEach(function (d, i) {
      var li = make('li', 'mcq-q');
      li.id = 'mcq-' + (base + i + 1);
      li.tabIndex = -1;                                 // holds focus between answers, so Space still scrolls
      var num = make('span', 'mcq-n');
      num.setAttribute('aria-hidden', 'true');
      var body = make('div', 'mcq-body');
      var text = make('div', 'mcq-text', glue(d.q));
      var opts = make('div', 'mcq-opts');
      opts.setAttribute('role', 'group');
      var btns = (d.options || []).map(function (o) {
        var b = make('button', 'mcq-opt');
        b.type = 'button';
        var l = make('span', 'mcq-l');
        b._letter = l.appendChild(document.createTextNode(''));
        b.append(l, make('span', 'mcq-t', glue(o)));
        return b;
      });
      var fb = make('p', 'mcq-fb');
      fb.hidden = true;
      fb.setAttribute('aria-live', 'polite');
      var fbt = fb.appendChild(document.createTextNode(''));
      var why = make('p', 'mcq-why', glue(d.why || ''));
      why.hidden = true;
      body.append(text, opts, fb, why);
      li.append(num, body);

      var q = { quiz: quiz, i: i, d: d, li: li, num: num.appendChild(document.createTextNode('')), opts: opts, btns: btns,
                fb: fb, fbt: fbt, why: why, ans: answerIndex(d.answer, btns.length), chosen: -1, perm: [], navA: null };
      li._mcq = q;
      btns.forEach(function (b, o) {                   // o = the option's index in the JSON
        b.addEventListener('click', function (e) { choose(q, q.perm.indexOf(o), e.detail === 0); });   // detail 0 = Enter / Space
      });
      li.addEventListener('pointerenter', function () { hoverQ = q; });
      li.addEventListener('pointerleave', function () { if (hoverQ === q) hoverQ = null; });
      if (quiz.nav) {
        var a = make('a', 'mcq-nav-n');
        a.href = '#' + li.id;
        q.navT = a.appendChild(document.createTextNode(''));
        a.addEventListener('click', function (e) { e.preventDefault(); glideTo(li); li.focus({ preventScroll: true }); });
        q.navA = a;
      }
      quiz.qs.push(q);
    });

    var bar = make('div', 'mcq-bar');
    var copyB = make('button', 'btn mcq-copy', 'Copy answers');
    copyB.type = 'button';
    var resetB = make('button', 'btn mcq-reset', 'Start over');
    resetB.type = 'button';
    var score = make('span', 'mcq-score');
    score.setAttribute('aria-live', 'polite');
    var scoreT = score.appendChild(document.createTextNode(''));
    var fallback = make('textarea', 'mcq-fallback');
    fallback.readOnly = true;
    fallback.hidden = true;
    fallback.setAttribute('aria-label', 'Answers to copy');
    bar.append(copyB, resetB, score);
    root.append(list, bar, fallback);

    // lay the questions and options out in the order the seed gives
    function arrange(seed) {
      var rand = rng(seed);
      quiz.order = shuffled(quiz.qs.length, rand).map(function (i) { return quiz.qs[i]; });
      quiz.qs.forEach(function (q) { q.perm = shuffled(q.btns.length, rand); });
      quiz.order.forEach(function (q, p) {
        list.append(q.li);
        q.num.nodeValue = String(p + 1);
        q.opts.setAttribute('aria-label', 'Question ' + (p + 1));
        q.perm.forEach(function (o, j) { q.opts.append(q.btns[o]); q.btns[o]._letter.nodeValue = LETTERS[j]; });
        if (q.navA) { quiz.nav.append(q.navA); q.navT.nodeValue = String(p + 1); }
      });
    }
    function mark(q) {
      var done = q.chosen >= 0, right = done && q.chosen === q.ans;
      q.li.classList.toggle('is-done', done);
      q.li.classList.toggle('is-wrong', done && !right);
      q.btns.forEach(function (b, o) {
        b.classList.toggle('is-chosen', done && o === q.chosen);
        b.classList.toggle('is-answer', done && o === q.ans);
        if (done) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled');
      });
      q.fbt.nodeValue = !done ? '' : right ? 'Correct.' : 'Incorrect. The answer is ' + LETTERS[q.perm.indexOf(q.ans)] + '.';
      q.fb.hidden = !done;
      q.why.hidden = !done || !q.d.why;
      if (q.navA) { q.navA.classList.toggle('is-right', right); q.navA.classList.toggle('is-wrong', done && !right); }
    }
    function save() {
      try { localStorage.setItem(key, JSON.stringify({ seed: state.seed, answers: quiz.qs.map(function (q) { return q.chosen; }) })); } catch (e) {}
    }
    function tally() {
      var answered = 0, right = 0;
      quiz.qs.forEach(function (q) { if (q.chosen >= 0) { answered++; if (q.chosen === q.ans) right++; } });
      var left = quiz.qs.length - answered;
      scoreT.nodeValue = !answered ? '' : right + ' of ' + answered + ' correct' + (left ? ' · ' + left + ' left' : '');
      save();
    }
    function next(q) {
      var p = quiz.order.indexOf(q);
      var rest = quiz.order.slice(p + 1).concat(quiz.order.slice(0, p)).filter(function (x) { return x.chosen < 0; });
      if (rest.length) { rest[0].li.focus({ preventScroll: true }); glideTo(rest[0].li); }
      else { q.li.focus({ preventScroll: true }); glideTo(root.querySelector('.frq-q') || bar); }  // on to the FRQs
    }
    function choose(q, j, advance) {                   // j = position on screen
      if (q.chosen >= 0 || j < 0 || j >= q.btns.length) return;   // answered questions stay locked
      q.chosen = q.perm[j];
      mark(q);
      tally();
      if (advance) next(q);
      else q.li.focus({ preventScroll: true });        // off the button, so Space scrolls again
    }
    quiz.choose = choose;

    copyB.addEventListener('click', function () {
      var lines = [title, ''], answered = 0, right = 0;
      quiz.order.forEach(function (q, p) {
        lines.push((p + 1) + '. ' + asPlain(q.d.q));
        q.perm.forEach(function (o, j) { lines.push('   ' + LETTERS[j] + '. ' + asPlain(q.d.options[o])); });
        var A = LETTERS[q.perm.indexOf(q.ans)];
        if (q.chosen < 0) lines.push('   Skipped. Answer: ' + A);
        else {
          answered++;
          var C = LETTERS[q.perm.indexOf(q.chosen)];
          if (q.chosen === q.ans) { right++; lines.push('   Your answer: ' + C + ' (correct)'); }
          else lines.push('   Your answer: ' + C + ' (incorrect). Answer: ' + A);
        }
        lines.push('');
      });
      var skipped = quiz.qs.length - answered;
      lines.push('Score: ' + right + ' of ' + quiz.qs.length + (skipped ? ' (' + skipped + ' skipped)' : ''));
      copyText(copyB, lines.join('\n'), fallback);
    });
    resetB.addEventListener('click', function () {      // a fresh order: same elements, moved
      quiz.qs.forEach(function (q) { q.chosen = -1; mark(q); });
      state.seed = newSeed();
      arrange(state.seed);
      tally();
      var first = quiz.order[0];
      glideTo(first.li);
      first.li.focus({ preventScroll: true });
    });

    arrange(state.seed);
    quiz.qs.forEach(function (q, i) {                  // reopen where you left off
      var s = state.answers[i];
      if (typeof s === 'number' && s >= 0 && s < q.btns.length) { q.chosen = s; mark(q); }
    });
    tally();
    quizzes.push(quiz);

    var issues = data.reduce(function (acc, d, i) { return acc.concat(auditOne(d, i)); }, []);
    if (issues.length && window.console) console.warn('quiz.js: ' + issues.length + ' question(s) give the answer away', issues);

    var MJ = window.MathJax, targets = [root].concat(quiz.nav ? [quiz.nav] : []);
    if (MJ && MJ.startup && MJ.startup.promise) MJ.startup.promise.then(function () { return MJ.typesetPromise(targets); }).catch(function () {});
    else if (MJ && typeof MJ.typesetPromise === 'function') MJ.typesetPromise(targets).catch(function () {});
  }

  /* ── keys: A–F or 1–6 answer the current question ─────────────────────── */
  function current() {
    var a = document.activeElement, li = a && a.closest && a.closest('.mcq-q');
    var q = li && li._mcq;
    if (q && q.chosen < 0 && shown(q)) return q;
    if (hoverQ && hoverQ.chosen < 0 && shown(hoverQ)) return hoverQ;
    var lis = document.querySelectorAll('.mcq-q');      // page order = the shuffled order
    for (var i = 0; i < lis.length; i++) {
      var x = lis[i]._mcq;
      if (x && x.chosen < 0 && shown(x) && onScreen(x)) return x;
    }
    return null;
  }
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey || e.repeat || e.defaultPrevented) return;
    var a = document.activeElement;
    if (a && (a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) return;
    var j = e.key.length === 1 ? LETTERS.indexOf(e.key.toUpperCase()) : -1;
    if (j < 0 && /^[1-6]$/.test(e.key)) j = +e.key - 1;
    if (j < 0) return;
    var q = current();
    if (!q || j >= q.btns.length) return;
    e.preventDefault();
    q.quiz.choose(q, j, true);
  });

  function init() {
    document.querySelectorAll('.mcq').forEach(function (r) {
      if (!r.dataset.built) { r.dataset.built = '1'; build(r); }
    });
  }
  init();                                               // the quiz markup sits above this script
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);

  window.MCQ = {
    init: init,
    // every giveaway in every quiz on the page; must be empty before publishing
    audit: function () {
      return quizzes.reduce(function (acc, z) {
        return acc.concat(z.data.reduce(function (a2, d, i) { return a2.concat(auditOne(d, i)); }, []));
      }, []);
    },
    _shuffle: function (n, seed) { return shuffled(n, rng(seed)); }   // for tests
  };
})();

</script>
<script>

/* page.js — this page's own behavior: FRQs, switching between the two tests,
   and holding the questions back until the math is drawn. Everything is made
   once at load; switching and answering only change attributes and text.  */
(function () {
  'use strict';
  var html = document.documentElement;
  var pane = document.querySelector('.pane-r');
  var tests = [].slice.call(document.querySelectorAll('.test'));
  var rows = [].slice.call(document.querySelectorAll('.pane-l .row[data-test]'));
  var navs = {}, mem = {}, cur = null;

  function make(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function glue(s) { return String(s).replace(/\\\)([.,;:!?])/g, '$1\\)'); }
  function asPlain(s) { return String(s).replace(/\\\(|\\\)/g, '$').replace(/\\\[|\\\]/g, '$$$$'); }
  function glide(el) {
    var top = el.getBoundingClientRect().top - pane.getBoundingClientRect().top;
    var y = Math.max(0, pane.scrollTop + top - pane.clientHeight * 0.18);
    if (window.SmoothScroll) SmoothScroll.to(pane, y); else pane.scrollTop = y;
  }
  function copy(btn, text, fallback) {
    var label = btn.firstChild, was = label.nodeValue;
    function done() { fallback.hidden = true; label.nodeValue = 'Copied'; setTimeout(function () { label.nodeValue = was; }, 1400); }
    function fail() { fallback.value = text; fallback.hidden = false; fallback.focus(); fallback.select(); }
    try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
  }

  tests.forEach(function (t) {
    var root = t.querySelector('.mcq');
    var nav = document.querySelector(root.getAttribute('data-nav'));
    navs[t.id] = nav;
    var data = JSON.parse(t.querySelector('script.frq-data').textContent);
    var n0 = JSON.parse(root.querySelector('script[type="application/json"]').textContent).length;
    var key = 'bipn:frq:' + t.getAttribute('data-key');
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) {}
    if (!saved || !Array.isArray(saved.text)) saved = { text: [], open: [] };

    var list = make('ol', 'frq-list');
    var items = data.map(function (d, i) {
      var n = n0 + i + 1;
      var li = make('li', 'frq-q');
      li.id = t.id + '-frq-' + (i + 1);
      li.tabIndex = -1;
      var num = make('span', 'mcq-n', String(n));
      num.setAttribute('aria-hidden', 'true');
      var body = make('div', 'mcq-body');
      var text = make('div', 'mcq-text', glue(d.q));
      var box = make('textarea', 'frq-in');
      box.id = li.id + '-in';
      box.rows = 6;
      box.spellcheck = false;
      box.setAttribute('aria-label', 'Your answer to question ' + n);
      box.value = saved.text[i] || '';
      var act = make('div', 'frq-act');
      var btn = make('button', 'btn frq-show');
      btn.type = 'button';
      var label = btn.appendChild(document.createTextNode('Show answer'));
      act.append(btn);
      var ans = make('div', 'frq-ans');
      ans.append(make('p', null, glue(d.answer)));
      if (d.points && d.points.length) {
        var ul = make('ul', 'frq-pts');
        d.points.forEach(function (p) { ul.append(make('li', null, glue(p))); });
        ans.append(ul);
      }
      body.append(text, box, act, ans);
      li.append(num, body);
      list.append(li);
      var it = { d: d, n: n, li: li, box: box, ans: ans, navA: null };
      it.open = function (v) {
        ans.hidden = !v;
        label.nodeValue = v ? 'Hide answer' : 'Show answer';
        btn.setAttribute('aria-expanded', v ? 'true' : 'false');
      };
      it.open(!!saved.open[i]);
      btn.addEventListener('click', function () { it.open(ans.hidden); save(); });
      box.addEventListener('input', save);
      if (nav) {
        var a = make('a', 'mcq-nav-n', String(n));
        a.href = '#' + li.id;
        a.addEventListener('click', function (e) { e.preventDefault(); glide(li); li.focus({ preventScroll: true }); });
        it.navA = a;
      }
      return it;
    });
    function save() {
      try {
        localStorage.setItem(key, JSON.stringify({
          text: items.map(function (x) { return x.box.value; }),
          open: items.map(function (x) { return !x.ans.hidden; })
        }));
      } catch (e) {}
    }
    function navTail() { if (nav) items.forEach(function (x) { nav.append(x.navA); }); }

    var bar = root.querySelector('.mcq-bar');
    var fallback = root.querySelector('.mcq-fallback');
    var reset = root.querySelector('.mcq-reset');
    root.insertBefore(list, bar);
    navTail();

    var copyW = make('button', 'btn frq-copy');
    copyW.type = 'button';
    copyW.appendChild(document.createTextNode('Copy written answers'));
    bar.insertBefore(copyW, reset);
    copyW.addEventListener('click', function () {
      var lines = [root.getAttribute('data-title') + ', written answers', ''];
      items.forEach(function (x) {
        lines.push(x.n + '. ' + asPlain(x.d.q));
        lines.push('   Your answer: ' + (x.box.value.trim() || 'Skipped'));
        lines.push('   Model answer: ' + asPlain(x.d.answer));
        (x.d.points || []).forEach(function (p) { lines.push('   - ' + asPlain(p)); });
        lines.push('');
      });
      copy(copyW, lines.join('\n'), fallback);
    });
    reset.addEventListener('click', function () {   // quiz.js reshuffles first; then clear the written answers
      items.forEach(function (x) { x.box.value = ''; x.open(false); });
      save();
      navTail();
    });
  });

  // the two tests already exist; switching only flips `hidden` and aria-current
  function show(id) {
    if (!/^test-\d+$/.test(id) || !document.getElementById(id)) id = tests[0].id;
    if (cur === id) return;
    if (cur) mem[cur] = pane.scrollTop;
    tests.forEach(function (t) { t.hidden = t.id !== id; });
    rows.forEach(function (r) { r.setAttribute('aria-current', r.getAttribute('data-test') === id ? 'true' : 'false'); });
    Object.keys(navs).forEach(function (k) { if (navs[k]) navs[k].hidden = k !== id; });
    cur = id;
    pane.scrollTop = mem[id] || 0;
  }
  function fromHash() { show((location.hash || '').slice(1)); }
  addEventListener('hashchange', fromHash);
  fromHash();

  // the questions wait behind the loading ring until MathJax has drawn them
  window.__mathReady = function () { html.classList.remove('mj-wait'); };
  setTimeout(window.__mathReady, 9000);
})();

</script>
