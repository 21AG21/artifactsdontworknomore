<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artifacts</title>
<link rel="stylesheet" href="/assets/minimono.css">
<style>
/* left pane: search + subjects */
.side{ display:flex; flex-direction:column; gap:28px; margin-top:28px; }
.side .row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  background:none; border:0; border-bottom:1px solid var(--hair-soft); text-align:left; font:inherit; font-size:clamp(17px, 1.15vw, 22px); }
.side .row:last-child{ border-bottom:0; }
.side .row .n{ font-size:15px; color:var(--muted); font-variant-numeric:tabular-nums; }
.side .row[aria-current="true"] .n{ color:var(--ink-soft); }

/* right pane: the widgets */
.grid{ list-style:none; margin:0; padding:0; display:grid;
  grid-template-columns:repeat(auto-fill, minmax(clamp(300px, 22vw, 440px), 1fr)); gap:64px 56px; }
.w{ border-top:1px solid var(--hair); }
.w[hidden]{ display:none; }
.w a{ display:flex; flex-direction:column; gap:10px; padding-top:20px; }
.w .k{ font-size:14px; font-weight:500; color:var(--ink-soft); }
.w .t{ font-size:clamp(28px, 1.9vw, 40px); font-weight:300; line-height:1.15; letter-spacing:-.02em; color:var(--ink); }
.w .d{ font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; }
@media (hover:hover){ .w a:hover .t{ text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:.18em; text-decoration-color:var(--hair); } }
.w a:active{ opacity:.6; }

/* code box for unlisted artifacts */
.unlock{ display:flex; flex-direction:column; gap:12px; margin-top:12px; }
#code{ -webkit-appearance:none; appearance:none; width:100%; max-width:420px; font:inherit; font-size:16px; color:var(--ink);
  background:var(--wall); border:0; border-radius:10px; padding:10px 14px; }
#code::placeholder{ color:var(--muted); }
.unlock .err{ margin:0; font-size:15px; font-weight:500; color:var(--ink); }
.unlock [hidden]{ display:none; }

.none{ font-size:clamp(17px, 1.05vw, 20px); color:var(--ink-soft); margin:0; }
.none[hidden]{ display:none; }
</style>
</head>
<body>
<div id="app">
  <nav class="pane-l">
    <button class="pane-hide" type="button"><span class="hide">Hide</span><span class="keep">Keep open</span><kbd>`</kbd></button>
    <div class="side">
      <input type="search" id="q" placeholder="Search" aria-label="Search artifacts" autocomplete="off">
      <div id="subjects"></div>
      <form class="unlock" id="unlock" autocomplete="off">
        <input id="code" type="text" placeholder="Code" aria-label="Code for an unlisted artifact" spellcheck="false" autocapitalize="off">
        <div class="loading" id="ring" hidden role="status" aria-label="Checking code"></div>
        <p class="err" id="codeMsg" hidden>That code didn&rsquo;t match.</p>
      </form>
    </div>
  </nav>
  <main class="pane-r">
    <a class="menu-hint" href="#">Menu<kbd>`</kbd></a>
    <div class="body">
      <div class="loading" id="loading" role="status" aria-label="Loading"></div>
      <ul class="grid" id="grid"></ul>
      <p class="none" id="none" hidden>Nothing matches.</p>
    </div>
  </main>
</div>

<script>
(function(){
  var grid = document.getElementById('grid');
  var subjectsEl = document.getElementById('subjects');
  var q = document.getElementById('q');
  var none = document.getElementById('none');
  var loading = document.getElementById('loading');
  var KEY = 'artifacts:subject';
  var current = 'All';
  try { current = localStorage.getItem(KEY) || 'All'; } catch (e) {}

  function fmt(iso){
    var d = new Date(iso + 'T12:00:00');
    return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month:'long', day:'numeric', year:'numeric' });
  }

  // Built once from the list. Afterwards, filtering only flips `hidden` and `aria-current`.
  function build(items){
    items.sort(function(a, b){ return (b.added || '').localeCompare(a.added || ''); });

    var counts = { All: items.length }, order = ['All'];
    items.forEach(function(it){
      var s = it.subject || 'Other';
      if (!(s in counts)) { counts[s] = 0; order.push(s); }
      counts[s]++;
    });
    order = ['All'].concat(order.slice(1).sort());
    if (!(current in counts)) current = 'All';

    order.forEach(function(s){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'row'; b.dataset.subject = s;
      var name = document.createElement('span'); name.textContent = s;
      var n = document.createElement('span'); n.className = 'n'; n.textContent = counts[s];
      b.append(name, n);
      subjectsEl.appendChild(b);
    });

    items.forEach(function(it){
      var li = document.createElement('li');
      li.className = 'w';
      li.dataset.subject = it.subject || 'Other';
      li.dataset.text = [it.title, it.subject, it.kind].join(' ').toLowerCase();
      var a = document.createElement('a');
      a.href = '/' + it.slug + '/';
      var k = document.createElement('span'); k.className = 'k';
      k.textContent = [it.subject, it.kind].filter(Boolean).join(' · ');
      var t = document.createElement('span'); t.className = 't'; t.textContent = it.title;
      var d = document.createElement('span'); d.className = 'd'; d.textContent = fmt(it.added);
      a.append(k, t, d);
      li.appendChild(a);
      grid.appendChild(li);
    });

    apply();
  }

  function apply(){
    var term = q.value.trim().toLowerCase(), shown = 0;
    subjectsEl.querySelectorAll('.row').forEach(function(r){
      r.setAttribute('aria-current', r.dataset.subject === current ? 'true' : 'false');
    });
    grid.querySelectorAll('.w').forEach(function(w){
      var ok = (current === 'All' || w.dataset.subject === current) &&
               (!term || w.dataset.text.indexOf(term) !== -1);
      w.hidden = !ok;
      if (ok) shown++;
    });
    none.hidden = shown > 0;
  }

  subjectsEl.addEventListener('click', function(e){
    var r = e.target.closest('.row');
    if (!r) return;
    current = r.dataset.subject;
    try { localStorage.setItem(KEY, current); } catch (err) {}
    apply();
  });
  q.addEventListener('input', apply);

  // Unlisted artifacts: the code derives the folder; nothing on the site lists them.
  var unlock = document.getElementById('unlock');
  var codeIn = document.getElementById('code');
  var ring = document.getElementById('ring');
  var codeMsg = document.getElementById('codeMsg');
  unlock.addEventListener('submit', async function(e){
    e.preventDefault();
    var code = codeIn.value;
    if (!code.trim() || !window.ADNM) return;
    ring.hidden = false; codeMsg.hidden = true;
    try {
      var d = await window.ADNM.derive(code);
      var r = await fetch('/u/' + d.id + '/', { method:'HEAD', cache:'no-cache' });
      if (!r.ok) throw new Error(r.status);
      window.ADNM.remember(d.id, code);
      location.href = '/u/' + d.id + '/';
    } catch (err) {
      ring.hidden = true; codeMsg.hidden = false; codeIn.select();
    }
  });
  codeIn.addEventListener('input', function(){ codeMsg.hidden = true; });

  fetch('/artifacts.json', { cache:'no-cache' })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(items){ loading.remove(); build(Array.isArray(items) ? items : []); })
    .catch(function(){
      loading.remove();
      none.textContent = 'The list didn’t load. Reload to try again.';
      none.hidden = false;
    });
})();
</script>
<script src="/assets/locked.js"></script>
<script src="/assets/minimono.js"></script>
<script src="/assets/smooth-scroll.js"></script>
</body>
</html>
